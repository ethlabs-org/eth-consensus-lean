# CI of record: GitHub Actions (docs/decisions.md §"Repository, toolchain and trust checks").
# Full tier: `scripts/check.sh --full` (every step and self-test, incl. leanchecker kernel replay, `lake check`
# and `lake comparator --paranoid` in a bubblewrap sandbox) on a clean project build. Nightly (skipped when
# main's head already passed a full run), on demand, and on `milestone*` / `release*` tags.
# A clean-build producer runs the main gates and replay fixtures; four consumers replay disjoint leaf sets.
# A separate job runs `lake check`; certification also requires exact replay inventory coverage.
# The fast tier (ci.yml) runs on every pull request and push to main.
# Manual runs: `gh workflow run full.yml` (main) or `gh workflow run full.yml --ref <tag or branch>` (a milestone,
# release or toolchain/Mathlib bump candidate). The checkers are the toolchain's own (pinned by lean-toolchain):
# leanchecker, leanchecker-paranoid, lean4lean, nanoda, con-leche and con-ron, all bundled with Lean; the sandbox is
# bubblewrap, installed below. Sized for the standard public runner (4 vCPU, 16 GB): the heaviest test modules
# build one at a time, and kernel replay runs 2 leaves at once (most peak ~3.3 GB, the heaviest test modules ~5.5 GB).
name: full

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    tags: ["milestone*", "release*"]

permissions:
  contents: read

concurrency:
  # A manual run per ref; a scheduled or tag run per commit, so a dispatch on main never displaces a pending nightly
  # (a shared group keeps only the newest pending run). Never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.ref || github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    name: Skip a nightly run on an already checked commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          n=0
          if [[ "$EVENT" == schedule ]]; then
            n="$(gh run list -R "$GITHUB_REPOSITORY" --workflow full.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          fi
          if [[ "$n" -gt 0 ]]; then
            echo "::notice::$GITHUB_SHA already passed a full run: nightly skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  full:
    name: scripts/check.sh --full --split ${{ matrix.part }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The unsplit tier takes ~25 min on 8 CPUs; a cold split part on 4 vCPUs takes longer (lake check
    # alone ~15 min single-threaded). Well inside the 6 h hosted limit.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        part: [main, lake-check]
    steps:
      - name: Check out consensus-lean
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan v4.2.4 (pinned release, sha256-checked; toolchain from lean-toolchain)
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tgz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tgz" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/elan.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report Lean toolchain
        run: |
          lean --version
          lake --version

      # Saved only right after `cache get` below, so an exact hit always holds Mathlib's oleans and `cache get` (a
      # ~22 s no-op then) is skipped. A docs-only run, which skips `cache get`, never saves it.
      - name: Restore Lake packages
        id: pkgs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Restore Mathlib olean cache (not needed on an exact packages cache hit)
        if: steps.pkgs.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Save Lake packages (with Mathlib's oleans)
        if: steps.pkgs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Sandbox for lake comparator / lake check
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap jq
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-user true    # smoke: fails the job if userns is still blocked

      # Before check.sh's parallel build (4 jobs): two of these at once would exceed the runner's memory.
      - name: Build the heaviest test modules one at a time (clean project build; no .lake/build cache)
        if: matrix.part == 'main'
        run: |
          set -euo pipefail
          for f in ConsensusLeanTest/Goldilocks/{Mirror,HalfCommittee,InitialCarry}/*.lean; do
            m="${f%.lean}"; m="${m//\//.}"
            echo "::group::lake build $m"; lake build --wfail --iofail "$m"; echo "::endgroup::"
          done

      - name: Run scripts/check.sh --full --split (clean project build; no .lake/build cache)
        env:
          CI: "1"
          REPLAY_JOBS: "2"
          PART: ${{ matrix.part }}
        run: |
          set -o pipefail
          if [[ "$PART" == main ]]; then
            scripts/check.sh --full --split main --defer-replay --defer-lint --result-file "$RUNNER_TEMP/result.json" 2>&1 | tee "$RUNNER_TEMP/check.log"
          else
            scripts/check.sh --full --split lake-check --no-shared-selftests --result-file "$RUNNER_TEMP/result.json" 2>&1 | tee "$RUNNER_TEMP/check.log"
          fi

      - name: Validate structured part result and clean tree
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          jq -e --arg part "$PART" '.mode == "full" and .part == $part and .status == "passed" and .exit_code == 0' "$RUNNER_TEMP/result.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'result.json').read_text())
          skipped = result['steps_skipped']
          lake_check = '10 lake check (+ fixtures/lakecheck-{bad,good})'
          if os.environ['PART'] == 'main':
              assert sorted((s['step'], s['reason']) for s in skipped) == sorted([
                  ('1b deferred syntax lint', 'owned by lint job'),
                  ('5 kernel replay', 'owned by replay shards'),
                  (lake_check, 'the other --split part'),
              ]), 'main must defer only syntax lint, production replay and lake check'
          else:
              assert lake_check in result['steps_run'], 'lake check did not run'
              for s in skipped:
                  number = s['step'].split()[0]
                  shared = (number == '0' and 'self-test' in s['step'] and
                            not s['step'].startswith('0 pins') and
                            s['reason'] == 'shared self-test owned by split main')
                  other = (number in {'1', '1b', '2', '2b', '3', '3b', '3c', '4', '5', '6', '7', '8', '9', '11', '12', '13', '14'} and
                           s['reason'] == 'the other --split part')
                  assert shared or other, f'unexpected skipped gate: {s}'
          PY
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: Pack the exact clean build for replay
        if: matrix.part == 'main'
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/replay-identity"
          sha256sum lean-toolchain lake-manifest.json >> "$RUNNER_TEMP/replay-identity"
          tar -C .lake -cf - build | zstd -T0 -3 -q -o "$RUNNER_TEMP/replay-build.tar.zst"

      - name: Upload the clean certification build
        if: matrix.part == 'main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replay-build
          path: |
            ${{ runner.temp }}/replay-build.tar.zst
            ${{ runner.temp }}/replay-identity
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Summary (the part's result line and its SKIP/DEFER lines)
        if: always()
        run: |
          { echo '```'; grep -E '^(SKIP|DEFER|FAIL|check\.sh:)' "$RUNNER_TEMP/check.log" || echo "no check.sh result line"; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-log-full-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/check.log
            ${{ runner.temp }}/result.json
          retention-days: 30

  syntax-lint:
    name: Deferred syntax linters (all modules)
    needs: full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned elan and toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tgz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tgz" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/elan.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake packages
        id: pkgs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Restore Mathlib cache on a miss
        if: steps.pkgs.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Download this run's clean build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: replay-build
          path: ${{ runner.temp }}/replay-build

      - name: Verify build identity and unpack
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/replay-identity"
          sha256sum lean-toolchain lake-manifest.json >> "$RUNNER_TEMP/replay-identity"
          cmp "$RUNNER_TEMP/replay-identity" "$RUNNER_TEMP/replay-build/replay-identity"
          mkdir -p .lake
          zstd -dc "$RUNNER_TEMP/replay-build/replay-build.tar.zst" | tar -C .lake -xf -

      - name: Lint every source with two workers
        run: |
          set -euo pipefail
          python3 -I scripts/lint-syntax.py -j 2 2>&1 | tee "$RUNNER_TEMP/lint.log"
          test -z "$(git status --porcelain)"

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syntax-lint-log
          path: ${{ runner.temp }}/lint.log
          retention-days: 30

  replay:
    name: Kernel replay shard ${{ matrix.shard }}/4
    needs: full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned elan and toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tgz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tgz" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/elan.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake packages
        id: pkgs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Restore Mathlib cache on a miss
        if: steps.pkgs.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Download this run's clean build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: replay-build
          path: ${{ runner.temp }}/replay-build

      - name: Verify build identity and unpack
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/replay-identity"
          sha256sum lean-toolchain lake-manifest.json >> "$RUNNER_TEMP/replay-identity"
          cmp "$RUNNER_TEMP/replay-identity" "$RUNNER_TEMP/replay-build/replay-identity"
          mkdir -p .lake
          zstd -dc "$RUNNER_TEMP/replay-build/replay-build.tar.zst" | tar -C .lake -xf -

      - name: Replay the shard (freshness checked, never rebuilt)
        env:
          CI: '1'
          REPLAY_JOBS: '2'
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          scripts/check.sh --replay-shard "$SHARD/4" --replay-inventory "$RUNNER_TEMP/inventory" --result-file "$RUNNER_TEMP/result.json" \
            2>&1 | tee "$RUNNER_TEMP/replay.log"
          jq -e --arg part "$SHARD/4" --arg dir "$RUNNER_TEMP/inventory" \
            '.mode == "replay-shard" and .part == $part and .status == "passed" and .exit_code == 0 and
             .steps_skipped == [] and
             .inventories.expected == ($dir + "/expected.txt") and .inventories.replayed == ($dir + "/replayed.txt")' "$RUNNER_TEMP/result.json"
          test -z "$(git status --porcelain)"

      - name: Upload successful shard inventories
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replay-inventory-${{ matrix.shard }}
          path: ${{ runner.temp }}/inventory/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload replay log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replay-log-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/replay.log
            ${{ runner.temp }}/result.json
          retention-days: 30

  replay-coverage:
    name: Exact replay coverage
    needs: [full, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: replay-inventory-*
          path: inventories

      - name: Require identical expectations, disjoint shards and complete coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('inventories')
          expected = None
          union = []
          assert sorted(p.name for p in root.iterdir()) == [f'replay-inventory-{i}' for i in range(1, 5)]
          for i in range(1, 5):
              shard = root / f'replay-inventory-{i}'
              want = (shard / 'expected.txt').read_bytes()
              got = (shard / 'replayed.txt').read_bytes()
              assert want.endswith(b'\n') and b'\r' not in want
              assert (not got or got.endswith(b'\n')) and b'\r' not in got
              if expected is None:
                  expected = want
              assert want == expected, f'shard {i}: different expected inventory'
              modules = got.splitlines()
              assert modules == sorted(set(modules)), f'shard {i}: unsorted or duplicate modules'
              assert modules == want.splitlines()[i - 1::4], f'shard {i}: wrong round-robin selection'
              union.extend(modules)
          leaves = expected.splitlines()
          assert leaves == sorted(set(leaves)) and all(leaves), 'invalid expected inventory'
          assert len(union) == len(set(union)), 'overlapping shards'
          assert sorted(union) == leaves, 'missing or extra replay modules'
          print(f'PASS: four disjoint shards replayed all {len(leaves)} expected leaves exactly once')
          PY
