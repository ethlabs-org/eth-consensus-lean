# Fast tier, on every pull request and every push to main: a cached build (Mathlib via `lake exe cache get`,
# the project's .lake/build via actions/cache, falling back to main's latest) and `scripts/check.sh --fast`:
# pins, build (--wfail), imports, check-decls, axiom audit (solution closure, tests), Spec surface + snapshot diff,
# review pins, grep backstop, vendored hashes, comparator config, docs, metrics (report). Self-tests too when the
# change touches scripts/ or the build configuration, step 4's reach report (not a gate) when it touches the Spec,
# the challenge or scripts/, and the rebuild canary (step 14, a report) when it touches the build configuration.
# Docs-only PRs use --changed <base>: cheap global checks, without Mathlib/project build caches.
# Kernel replay, `lake check` and `lake comparator --paranoid` run in full.yml (nightly, manual, tags).
# Pushes to work/* branches without a PR run nothing here: iterate locally (scripts/check-changed.sh).
# Plus the review boundary (trusted surface vs the tag `spec-approved`). Action SHAs as in
# verified-consensus verify.yml.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build (cached) and scripts/check.sh --fast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out consensus-lean (full history, for the diff that decides the self-tests)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify docs-only pull requests (otherwise full fast tier)
        id: docs
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          docs_only=false
          # Only PRs into main: a docs-only PR into an unchecked work/* branch, later retargeted to main
          # (an `edited` event, which runs nothing), would otherwise carry a green check for unchecked code.
          # Checkout is the PR merge commit: diff against its base, not the previous push.
          # Materialize the diff first so a failed git command cannot look like an empty diff.
          if [[ "$EVENT" == pull_request && "$BASE_REF" == main && -n "$BASE" && ! "$BASE" =~ ^0+$ ]] &&
             git cat-file -e "$BASE^{commit}" 2>/dev/null &&
             git merge-base --is-ancestor "$BASE" HEAD &&
             git diff --no-renames --ignore-submodules=none --name-only -z "$BASE" HEAD -- > "$RUNNER_TEMP/pr-paths"; then
            docs_only=true
            while IFS= read -r -d '' path; do
              case "$path" in
                *.lean|scripts/*|.github/*|lakefile.toml|lake-manifest.json|lean-toolchain) docs_only=false; break ;;
                *.md|docs/*) ;;
                *) docs_only=false; break ;;
              esac
            done < "$RUNNER_TEMP/pr-paths"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only PR: $docs_only (otherwise --fast)"

      - name: Install elan v4.2.4 (pinned release, sha256-checked; toolchain from lean-toolchain)
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tgz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tgz" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/elan.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report Lean toolchain
        run: |
          lean --version
          lake --version
          jq --version

      - name: Restore Lake packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Restore Mathlib olean cache
        if: steps.docs.outputs.docs_only != 'true'
        run: lake exe cache get

      # Keyed on toolchain + manifest + commit. A miss falls back to the newest cache with the same toolchain
      # and manifest: this PR's previous push, else main's latest (PR caches are not visible to other branches).
      # Lake rebuilds only the modules whose inputs changed.
      - name: Restore project build (.lake/build)
        id: build-cache
        if: steps.docs.outputs.docs_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Self-tests and reach report, from what the change touches
        id: mode
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          paths=(scripts lakefile.toml lakefile.lean lake-manifest.json lean-toolchain)
          # Step 4's reach report (a report, not a gate): only when the trusted surface (`trusted_paths` of
          # scripts/boundaries.toml: Spec, statements, challenge, ...) or scripts/ changed (#13).
          export GIT_LITERAL_PATHSPECS=1
          trusted="$(python3 -I -c 'import tomllib
          print("\n".join(tomllib.load(open("scripts/boundaries.toml", "rb"))["checks"]["trusted_paths"]))')" ||
            { echo "::error::cannot read [checks] trusted_paths of scripts/boundaries.toml"; exit 1; }
          mapfile -t spec <<<"$trusted"
          spec+=(scripts)
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ('$BASE'): self-tests, reach report and rebuild canary on"; flags="--selftests --reach --canary"
          else
            flags=""
            if [[ -n "$(git diff --name-only "$BASE" HEAD -- "${paths[@]}")" ]]; then
              git diff --name-only "$BASE" HEAD -- "${paths[@]}"
              echo "the check stack or the build configuration changed: self-tests on"; flags="--selftests"
            else
              echo "no change to ${paths[*]}: self-tests off (nightly)"
            fi
            build_config=(lakefile.toml lakefile.lean lake-manifest.json lean-toolchain)
            if [[ -n "$(git diff --name-only "$BASE" HEAD -- "${build_config[@]}")" ]]; then
              echo "the build configuration changed: rebuild canary on"; flags="$flags --canary"
            fi
            if [[ -n "$(git diff --name-only "$BASE" HEAD -- "${spec[@]}")" ]]; then
              echo "the Spec, the challenge or scripts/ changed: reach report on"; flags="$flags --reach"
            else
              echo "no change to ${spec[*]}: reach report off (nightly)"
            fi
          fi
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      - name: Run scripts/check.sh (docs-only --changed, otherwise --fast)
        env:
          CI: "1"
          FLAGS: ${{ steps.mode.outputs.flags }}
          DOCS_ONLY: ${{ steps.docs.outputs.docs_only }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$DOCS_ONLY" == true ]]; then
            scripts/check.sh --changed "$BASE" 2>&1 | tee "$RUNNER_TEMP/check.log"
          else
            # shellcheck disable=SC2086
            scripts/check.sh --fast $FLAGS 2>&1 | tee "$RUNNER_TEMP/check.log"
          fi

      - name: Selected mode passed, tree clean
        env:
          DOCS_ONLY: ${{ steps.docs.outputs.docs_only }}
        run: |
          set -euo pipefail
          mode=fast
          [[ "$DOCS_ONLY" != true ]] || mode=changed
          grep -q "^check.sh: PASSED ($mode mode" "$RUNNER_TEMP/check.log"
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: Save project build (.lake/build)
        if: ${{ !cancelled() && steps.docs.outputs.docs_only != 'true' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-log
          path: ${{ runner.temp }}/check.log
          retention-days: 30

  review-boundary:
    # The trusted surface (`trusted_paths` in scripts/boundaries.toml; docs/spec-review.md) against the commit
    # tagged `spec-approved`: a change the tag does not cover fails (without the tag, a warning only). Only the owner, or an agent he authorizes, moves the
    # tag, after reviewing the diff printed here. Check infrastructure (scripts/, .github/, lakefile.toml) is
    # covered by CODEOWNERS and PR review instead.
    name: Review boundary (trusted surface = spec-approved)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out consensus-lean (full history and tags; fetch-depth 0 also fetches every tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Trusted surface unchanged since spec-approved
        run: |
          set -euo pipefail
          # The trusted paths: `trusted_paths` of scripts/boundaries.toml at HEAD, united with the list at the tag
          # (where it has one), so a PR cannot drop a path from the check by editing the list. Literal pathspecs
          # only: an entry with git pathspec magic (`:(exclude)...`) or a glob is refused, and git reads none.
          export GIT_LITERAL_PATHSPECS=1
          paths_at() {  # paths_at <rev>: the list in <rev>'s boundaries.toml, one per line (nothing if absent)
            git show "$1:scripts/boundaries.toml" 2>/dev/null | python3 -I -c 'import sys, tomllib
          print("\n".join(tomllib.loads(sys.stdin.read()).get("checks", {}).get("trusted_paths", [])))' || true
          }
          mapfile -t protected < <({ paths_at HEAD; paths_at 'refs/tags/spec-approved^{commit}'; } | awk NF | LC_ALL=C sort -u)
          if [[ -z "$(paths_at HEAD)" ]]; then
            echo "::error::scripts/boundaries.toml at HEAD has no [checks] trusted_paths"; exit 1
          fi
          for p in "${protected[@]}"; do
            [[ "$p" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*$ && "/$p/" != */../* ]] ||
              { echo "::error::trusted_paths entry '$p' is not a plain relative path"; exit 1; }
          done
          echo "trusted paths: ${protected[*]}"
          if ! git rev-parse -q --verify 'refs/tags/spec-approved^{commit}' >/dev/null; then
            echo "::warning title=Review boundary: not yet approved::no tag spec-approved: the trusted surface is not yet approved (non-blocking until the tag exists; see docs/spec-review.md)"
            exit 0
          fi
          if ! git diff --quiet spec-approved HEAD -- "${protected[@]}"; then
            echo "::error::trusted surface changed since spec-approved ($(git rev-parse --short spec-approved)): awaiting owner approval (move the tag to this PR head after review)"
            git diff --stat spec-approved HEAD -- "${protected[@]}"
            exit 1
          fi
          echo "trusted surface unchanged since spec-approved ($(git rev-parse --short spec-approved))"
