# Correctness (scripts/check.sh with bubblewrap, so lake check and lake comparator run) and the review
# boundary (protected paths unchanged since the owner's tag `spec-approved`). Action SHAs as in
# verified-consensus verify.yml. The --paranoid comparator run is in paranoid.yml (weekly + manual).
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and run scripts/check.sh (incl. lake check / lake comparator)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out consensus-lean
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan v4.2.4 (pinned release, sha256-checked; toolchain from lean-toolchain)
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tgz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tgz" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/elan.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Restore Lake packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Restore Mathlib olean cache
        run: lake exe cache get

      - name: Sandbox for lake comparator / lake check
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap jq
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-user true    # smoke: fails the job if userns is still blocked

      - name: Run scripts/check.sh
        env:
          CI: "1"
        run: |
          set -o pipefail
          scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: No skipped sandbox steps, no partial run, no regenerated baseline
        run: |
          set -euo pipefail
          if grep -E 'skipped: no bwrap|PASSED \(partial' "$RUNNER_TEMP/check.log"; then exit 1; fi
          grep -qx 'check.sh: ALL CHECKS PASSED' "$RUNNER_TEMP/check.log"
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-log
          path: ${{ runner.temp }}/check.log
          retention-days: 30

  review-boundary:
    # Red while a protected path (plan §4.6) differs from the commit tagged `spec-approved`, and red until
    # the owner first sets the tag. Only the owner moves it, after reviewing the diff this job prints:
    #   git tag -f spec-approved <sha> && git push -f origin spec-approved
    name: Review boundary (protected paths = spec-approved)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out consensus-lean (full history and tags; fetch-depth 0 also fetches every tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Protected paths unchanged since spec-approved
        run: |
          set -euo pipefail
          protected=(ConsensusSpec ConsensusSpec.lean ConsensusChallenge.lean comparator.json lean-toolchain
                     lakefile.toml lakefile.lean lake-manifest.json scripts ConsensusTests/ReviewAxioms.lean
                     ConsensusTests/ReviewGuard.lean .github)
          if ! git rev-parse -q --verify 'refs/tags/spec-approved^{commit}' >/dev/null; then
            echo "::error::no tag spec-approved: the owner has not yet approved the protected paths"
            exit 1
          fi
          if ! git diff --quiet spec-approved HEAD -- "${protected[@]}"; then
            echo "::error::protected paths changed since spec-approved ($(git rev-parse --short spec-approved)): awaiting owner review"
            git diff --stat spec-approved HEAD -- "${protected[@]}"
            exit 1
          fi
          echo "protected paths unchanged since spec-approved ($(git rev-parse --short spec-approved))"
