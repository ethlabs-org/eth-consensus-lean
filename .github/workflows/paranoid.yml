# `lake comparator --paranoid`: the review statements' proofs also replayed by every external checker
# bundled with Lean (leanchecker-paranoid, lean4lean, nanoda, con-leche, con-ron). Weekly and on demand,
# not per push (plan §4.5: the external kernels replay the whole export; the per-push job runs check.sh).
name: paranoid

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paranoid:
    name: lake comparator --paranoid
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out consensus-lean
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan v4.2.4 (pinned release, sha256-checked; toolchain from lean-toolchain)
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tgz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tgz" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/elan.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Restore Lake packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Restore Mathlib olean cache
        run: lake exe cache get

      - name: Sandbox for lake comparator / lake check
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap jq
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-user true    # smoke: fails the job if userns is still blocked

      - name: lake comparator --paranoid (comparator.json)
        run: |
          set -o pipefail
          /usr/bin/time -v lake comparator --paranoid --config comparator.json 2>&1 | tee "$RUNNER_TEMP/paranoid.log"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paranoid-log
          path: ${{ runner.temp }}/paranoid.log
          retention-days: 30
