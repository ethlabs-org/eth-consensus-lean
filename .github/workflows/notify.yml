# Monitoring: one short line per repository event to ntfy.sh (topic in the secret NTFY_TOPIC; nothing is
# sent when the secret is empty). Event type, number or ref, action or conclusion, actor: never titles or
# bodies. Every value reaches the script through env, never through ${{ }} inside `run`.
# High-signal events only: every run is a billed Actions minute (#18). CI results only when they fail. No comment or
# review events: they were most runs (307 runs, 219 billed minutes in a day of agent work, #50).
name: notify

on:
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed, ready_for_review]
  workflow_run:
    workflows: [check, full]
    types: [completed]

permissions: {}

jobs:
  notify:
    # A job-level `if` skips the job without starting a runner.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post one line
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_EVENT: ${{ github.event.workflow_run.event }}
          WF_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -u
          [[ -n "$NTFY_TOPIC" ]] || exit 0
          case "$EVENT" in
            issues) line="issue #$NUMBER $ACTION" ;;
            pull_request)
              [[ "$ACTION" == closed && "$MERGED" == true ]] && ACTION=merged
              line="PR #$NUMBER $ACTION ($HEAD_REF)" ;;
            workflow_run) line="CI $WF_NAME: $WF_CONCLUSION ($WF_EVENT, $WF_BRANCH${WF_PR:+, PR #$WF_PR})" ;;
            *) line="$EVENT $ACTION" ;;
          esac
          line="consensus-lean: $line by $ACTOR"
          curl -s -o /dev/null --max-time 20 -d "${line:0:300}" "https://ntfy.sh/$NTFY_TOPIC" || true
