name = "consensus-lean"
version = "0.1.0"
keywords = ["lean", "consensus", "specification"]
defaultTargets = ["ConsensusLean"]
testDriver = "ConsensusLeanTest"
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.flexible = false
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# The one certified library (plan §1): layers are module prefixes, not libraries: `Init` (curated imports),
# `Core`/`Spec`/`Statements` (TRUSTED: definitions and the review statements), `Lemmas`, `Proofs/<M>/`,
# `Main`, `ToMathlib`, `Instances/<P>/`. The root `ConsensusLean.lean` is generated
# (`lake exe mk_all --lib ConsensusLean --module`) and imports every module; nothing in the library imports it.
# Import rules: scripts/boundaries.toml (checked by scripts/, not by Lake).
[[lean_lib]]
name = "ConsensusLean"
globs = ["ConsensusLean.*"]

# Tests (teeth, rejections, controls, review pins) and Index (README-cited names): `lake test`, never a
# default target. Root generated likewise (`lake exe mk_all --lib ConsensusLeanTest --module`).
[[lean_lib]]
name = "ConsensusLeanTest"
globs = ["ConsensusLeanTest.*"]

# Comparator solution (comparator.json): proofs of the review statements. Never a default target.
[[lean_lib]]
name = "Solution"

# Comparator challenge (comparator.json): the review statements with `sorry` proofs.
# Never a default target; imports only the review statements module.
[[lean_lib]]
name = "Challenge"

# Fixtures for the self-tests of scripts/check.sh. Deliberately bad (sorry, axioms, macros).
# Never a default target; built only by check.sh. No root module: every fixture module is its own
# target, and fixtures that share declaration names (Snap*) are never imported into one environment.
[[lean_lib]]
name = "CheckFixtures"
srcDir = "scripts/fixtures"
roots = []
globs = ["CheckFixtures.+"]

# EthLib fixtures for check-decls (verbatim copies). Never a default target.
[[lean_lib]]
name = "CheckDeclsTest"
srcDir = "scripts"
roots = ["CheckDeclsTest", "CheckDeclsForeign"]

# EthLib check-decls (CC0; vendored copy with two local patches, see TRUST.md). Built by check.sh (`lake build check-decls`).
[[lean_exe]]
name = "check-decls"
srcDir = "scripts"
root = "CheckDecls"
supportInterpreter = true
