name = "consensus-lean"
version = "0.1.0"
keywords = ["lean", "consensus", "specification"]
defaultTargets = ["ConsensusSpec", "ConsensusProofs", "ConsensusInstances", "ConsensusTests"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.flexible = false
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# TRUSTED. Definitions (L0 Problem, L1 Model, Blocks, L2 Shape). Imports only ConsensusSpec,
# Mathlib and Lean (checked by scripts/, not by Lake).
[[lean_lib]]
name = "ConsensusSpec"
globs = ["ConsensusSpec.*"]

# Proofs of the Spec statements and their support (lemmas, derived definitions, canonical runs,
# witnesses). May import ConsensusSpec; never ConsensusInstances or ConsensusTests.
[[lean_lib]]
name = "ConsensusProofs"
globs = ["ConsensusProofs.*"]

# Protocol values: Goldilocks (with its sheet), Bft, Streamlet, Tendermint. Never ConsensusTests.
[[lean_lib]]
name = "ConsensusInstances"
globs = ["ConsensusInstances.*"]

# Tests (teeth, rejections, controls) and Index (README-cited names).
[[lean_lib]]
name = "ConsensusTests"
globs = ["ConsensusTests.*"]

# Comparator challenge (comparator.json): the review statements with `sorry` proofs.
# Never a default target; imports only ConsensusSpec.
[[lean_lib]]
name = "ConsensusChallenge"

# Fixtures for the self-tests of scripts/check.sh. Deliberately bad (sorry, axioms, macros).
# Never a default target; built only by check.sh. No root module: every fixture module is its own
# target, and fixtures that share declaration names (Snap*) are never imported into one environment.
[[lean_lib]]
name = "CheckFixtures"
srcDir = "scripts/fixtures"
roots = []
globs = ["CheckFixtures.+"]

# EthLib fixtures for check-decls (verbatim copies). Never a default target.
[[lean_lib]]
name = "CheckDeclsTest"
srcDir = "scripts"
roots = ["CheckDeclsTest", "CheckDeclsForeign"]

# EthLib check-decls (CC0; vendored copy with a local performance patch, see TRUST.md). Built by check.sh (`lake build check-decls`).
[[lean_exe]]
name = "check-decls"
srcDir = "scripts"
root = "CheckDecls"
supportInterpreter = true
