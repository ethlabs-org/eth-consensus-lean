name = "consensus-lean"
version = "0.1.0"
license = "Apache-2.0"
keywords = ["lean", "consensus", "specification"]
defaultTargets = ["ConsensusLean"]
testDriver = "ConsensusLeanTest"
lintDriver = "batteries/runLinter"

# FLT's options plus the longFile soft bound. `warn.sorry = false`: `sorry` does not warn, so
# `lake build --wfail` fails on every other warning while unfinished proofs stay possible; where `sorry` may
# appear (only the `sorry = true` layers of scripts/boundaries.toml: Lemmas, Proofs) is checked by
# scripts/check.sh (steps 3, 7) and the `Solution` closure must be free of it (step 3b, axiom audit).
[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
warn.sorry = false
weak.linter.style.longFile = 1500
weak.linter.mathlibStandardSet = true
weak.linter.flexible = false
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# The one certified library (docs/layout.md): layers are module prefixes, not libraries: `Init` (curated imports),
# `Core`/`Spec`/`Statements` (TRUSTED: definitions and the review statements), `Lemmas`, `Proofs/<M>/`,
# `Main`, `ToMathlib`, `Instances/<P>/`. The root `ConsensusLean.lean` is generated
# (`lake exe mk_all --lib ConsensusLean --module`) and imports every module; nothing in the library imports it.
# Import rules: scripts/boundaries.toml (checked by scripts/, not by Lake).
[[lean_lib]]
name = "ConsensusLean"
globs = ["ConsensusLean.*"]
precompileImports = true

# Tests (teeth, rejections, controls, review pins) and Index (README-cited names): `lake test`, never a
# default target. Root generated likewise (`lake exe mk_all --lib ConsensusLeanTest --module`).
[[lean_lib]]
name = "ConsensusLeanTest"
globs = ["ConsensusLeanTest.*"]
precompileImports = true

# Comparator solution (comparator.json): proofs of the review statements. Never a default target.
[[lean_lib]]
name = "Solution"
precompileImports = true

# Comparator challenge (comparator.json): the review statements with `sorry` proofs.
# Never a default target; imports only the review statements module. Its template (check.sh step 9)
# puts each statement on one line, `theorem <s> : <S> := sorry` with fully qualified names, which can
# exceed 100 characters, so the line-length linter is off for this library only (the option is in
# the Spec snapshot header, scripts/spec-snapshot.txt: changing it means regenerating the snapshot).
[[lean_lib]]
name = "Challenge"
leanOptions = { weak.linter.style.longLine = false }
precompileImports = true

# Fixtures for the self-tests of scripts/check.sh. Deliberately bad (sorry, axioms, macros).
# Never a default target; built only by check.sh. No root module: every fixture module is its own
# target, and fixtures that share declaration names (Snap*) are never imported into one environment.
[[lean_lib]]
name = "CheckFixtures"
srcDir = "scripts/fixtures"
roots = []
globs = ["CheckFixtures.+"]

# EthLib fixtures for check-decls (verbatim copies). Never a default target.
[[lean_lib]]
name = "CheckDeclsTest"
srcDir = "scripts"
roots = ["CheckDeclsTest", "CheckDeclsForeign"]

# EthLib check-decls (CC0; vendored copy with two local patches, see TRUST.md). Built by check.sh (`lake build check-decls`).
[[lean_exe]]
name = "check-decls"
srcDir = "scripts"
root = "CheckDecls"
supportInterpreter = true

# Spec surface tool of check.sh steps 4 and 9 (ours; snapshot, extensions, theorems, noconst, statements, reach).
# Compiled rather than `lean --run` (interpreted, about 45 s per call in CI). Built by check.sh. Never a default target.
[[lean_exe]]
name = "spec-surface"
srcDir = "scripts"
root = "SpecSurface"
supportInterpreter = true

# Constant dump of scripts/const-diff.py (report-only: did a change alter anything but proofs?). Compiled,
# like spec-surface; built by its self-test (scripts/test_const_diff.py, check.sh --selftests) and on demand.
# Never a default target.
[[lean_exe]]
name = "const-dump"
srcDir = "scripts"
root = "ConstDump"
supportInterpreter = true

# leanprover-community/axiom-audit v0.1.2 (Apache-2.0; vendored verbatim, see TRUST.md): the library and the
# executable (its `Main.lean` as `AxiomAuditMain.lean`). Built by check.sh; step 3b audits the `Solution` closure
# and reports the library's unfinished declarations. Never a default target.
[[lean_lib]]
name = "AxiomAudit"
srcDir = "scripts"
roots = ["AxiomAudit"]

[[lean_exe]]
name = "axiom-audit"
srcDir = "scripts"
root = "AxiomAuditMain"
supportInterpreter = true
