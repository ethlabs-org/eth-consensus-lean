# The one configuration file of scripts/check.sh and scripts/check-imports.py.
# Every library path, module prefix and module name of the project lives here, so a change of layout
# (a move of files) edits this file and nothing else in the check stack (fixture paths aside).
# Protected path: changes are reviewed by the owner.
#
# Layout: the four libraries of the plan (ConsensusSpec / ConsensusProofs / ConsensusInstances /
# ConsensusTests) with import rules R1-R3:
#   R1  the closure of every ConsensusSpec module, root included, holds only ConsensusSpec modules (+ base);
#   R2  every library: every file under its directory is reached from its root (root_covers); no non-root
#       module imports a library root, except in the tests;
#   R3  ConsensusProofs never reaches ConsensusInstances/ConsensusTests/ConsensusChallenge or a fixture;
#       ConsensusInstances never reaches ConsensusTests or a fixture; ConsensusChallenge (a fixture lib for
#       this check) may import only ConsensusSpec (checked by step 9).

# R1 base set: top-level module names that may be imported from outside the project.
base = ["Init", "Std", "Lean", "Lake", "Mathlib", "Batteries", "Aesop", "Qq", "ProofWidgets",
        "Plausible", "ImportGraph", "LeanSearchClient"]

# Non-default libraries (fixtures, deliberately bad, and the comparator challenge, which holds `sorry`).
# No default library may import them.
fixture_libs = ["CheckFixtures", "CheckDeclsTest", "ConsensusChallenge"]

# lean_exe targets of the lakefile (the check stack's tools). Every lakefile target is a [[lib]] below, a
# fixture lib or one of these; no lib root, glob or file may take a top-level name of `base`.
tool_exes = ["check-decls"]

# One [[lib]] per default target of lakefile.toml (asserted). `allow`: module prefixes that the import
# closure of every module of the library may contain. `root_covers` must be true: every file under `dir`
# is reached from the root. `may_import_roots`: non-root modules may import a library root (tests only).
[[lib]]
name = "ConsensusSpec"
root = "ConsensusSpec"
dir = "ConsensusSpec"
allow = ["ConsensusSpec"]
root_covers = true

[[lib]]
name = "ConsensusProofs"
root = "ConsensusProofs"
dir = "ConsensusProofs"
allow = ["ConsensusProofs", "ConsensusSpec"]
root_covers = true

[[lib]]
name = "ConsensusInstances"
root = "ConsensusInstances"
dir = "ConsensusInstances"
allow = ["ConsensusInstances", "ConsensusProofs", "ConsensusSpec"]
root_covers = true

[[lib]]
name = "ConsensusTests"
root = "ConsensusTests"
dir = "ConsensusTests"
allow = ["ConsensusTests", "ConsensusInstances", "ConsensusProofs", "ConsensusSpec"]
root_covers = true
may_import_roots = true   # tests

# Settings of scripts/check.sh (ignored by check-imports.py).
[checks]
# The Spec library: the snapshot (scripts/spec-snapshot.txt), `theorems`, grep 7b and the README file list
# (step 12) cover every module of its inventory (the root and every file under its directory; R1 keeps its
# import closure inside it), so no module list is kept by hand.
spec_lib = "ConsensusSpec"
# Libraries whose every module is held to the persisted-extension whitelist (scripts/spec-extensions.txt).
extension_libs = ["ConsensusSpec"]
# Modules with descendants that may own constants. leanchecker expands a module name as a prefix, so such a
# module would not be replayed by leanchecker (step 5), only by `lake check` (step 10, where bwrap exists).
# None: every parent owns nothing (M moved the 8 proofs of ConsensusProofs.Model.Canonical to
# Canonical/Construction.lean).
noconst_exempt = []
# `theorems` gate: "report" or "enforce". Enforced: a ranged theorem in a Spec module must be listed in
# scripts/spec-theorems.txt.
theorems_mode = "enforce"
# The file that pins the review theorems' types and axioms (#guard_msgs, alpha-equality guards); it must be
# imported directly by `review_root`.
review_axioms_module = "ConsensusTests.ReviewAxioms"
review_root = "ConsensusTests"
# Comparator (plan §3). Step 9 checks comparator.json against these modules and against the Prop
# definitions of `statements_module`; step 11 runs `lake comparator` (where bwrap exists).
challenge_module = "ConsensusChallenge"
solution_module = "ConsensusProofs.Review"
statements_module = "ConsensusSpec.Statements"
# Extra targets built by step 1 next to the default targets.
extra_build_targets = ["CheckFixtures", "CheckDeclsTest", "check-decls", "ConsensusChallenge"]
