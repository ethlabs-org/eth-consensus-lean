# The one configuration file of scripts/check-boundaries.py, scripts/check.sh, scripts/metrics-baseline.py and
# CI's review-boundary job. Every library path, module prefix, layer and module name of the project lives here,
# so a change of layout (a move of files) edits this file and nothing else in the check stack (fixtures aside).
#
# Layout (docs/layout.md): one certified library `ConsensusLean` whose layers are module prefixes, the tests
# `ConsensusLeanTest` (lake test) and the comparator solution `Solution`. Import rules: the [[layer]]
# matrix below, checked at source level by scripts/check-boundaries.py (its docstring has every rule).
# Deviations from the plan's matrix are the [[exception]] entries at the end, each with its reason.

# Top-level module names that may be imported from outside the project.
base = ["Init", "Std", "Lean", "Lake", "Mathlib", "Batteries", "Aesop", "Qq", "ProofWidgets",
        "Plausible", "ImportGraph", "LeanSearchClient"]

# Non-default libraries (fixtures, deliberately bad, and the comparator challenge, which holds `sorry`).
# No checked library may import them.
fixture_libs = ["CheckFixtures", "CheckDeclsTest", "Challenge"]

# lean_exe targets of the lakefile (the check stack's tools) and the lean_lib targets only they use. Every
# lakefile target is a [[lib]] below, a fixture lib or one of these; no lib root, glob or file may take a
# top-level name of `base`. No checked module may import a tool module (an unknown top-level name).
tool_exes = ["check-decls", "axiom-audit", "spec-surface", "const-dump"]
tool_libs = ["AxiomAudit"]

# Every module (except a generated root) reaches this one through public imports (as CSLib's Init).
init_module = "ConsensusLean.Init"
# Module prefixes exempt from the Init chain: ToMathlib imports only Mathlib; ReviewGuard is a meta
# tool on `Lean` alone, shared with the fixtures of check.sh step 6.
init_exempt = ["ConsensusLean.ToMathlib", "ConsensusLeanTest.ReviewGuard"]
# Every directory <parent>.<M> below is one milestone layer, imported from other layers only through
# <parent>.<M>.Main (Main may import every Proofs.<M>.Main; Proofs.<N>.Main only by an exception). A parent
# inside another parent's directory (the growing-fault milestones, Proofs.Growing.<M>) owns its own <M>.
milestone_parents = ["ConsensusLean.Proofs", "ConsensusLean.Instances.Goldilocks.Proofs",
                     "ConsensusLean.Instances.Goldilocks.Proofs.Growing"]
# No umbrella imports: import the modules you need. `Mathlib.Tactic` imports every tactic and the theory they
# need (2.1 s and 3.3 GB to load against 0.9 s and 1.5 GB for `Mathlib.Tactic.Common`, which `Init` provides);
# import the tactic modules a file uses, such as `Mathlib.Tactic.Linarith` or `Mathlib.Tactic.FinCases`.
forbidden_imports = ["Mathlib", "Mathlib.Tactic"]

# The checked libraries. A lib's root module is its name, and its name is its check-decls scope (step 3).
# `default`: exactly the lakefile defaultTargets. `test_driver`: the lakefile testDriver.
# `root_lists_all`: the lib is the root plus every file under its directory, and the root (generated:
# `lake exe mk_all --lib <name> --module`) imports every other module; otherwise the lib is one module.
[[lib]]
name = "ConsensusLean"
default = true
root_lists_all = true

[[lib]]
name = "ConsensusLeanTest"
test_driver = true
root_lists_all = true

[[lib]]
name = "Solution"

# The layer matrix (docs/layout.md). A module is in the layer whose prefix covers it (prefixes never overlap).
# `allow`: the other layers it may import directly, written out in full (the checker requires the lists to
# be downward-closed, so this row also bounds everything the layer reaches). `trusted`: the Spec surface
# (snapshot, extensions, theorems, grep 7b, the trusted-file list of docs/definition.md, trusted_paths); it allows only trusted
# layers. `sorry`: unfinished proofs may stay here (only Lemmas and Proofs, never a trusted layer;
# check.sh steps 3 and 7 fail a `sorry` anywhere else, and step 3b fails one in the closure of the solution). Tests: `may_import_roots` (the generated roots,
# import-only aggregates) and `may_import_all`. `expose`: `@[expose]` may appear here (whole-file expose
# in Core, Spec, Statements, the instance Spec/Statements and Milestones layers, AsChainShape and Examples; none in Lemmas, Proofs, Main and ToMathlib,
# where a definition used elsewhere gets characterising lemmas instead; check-boundaries.py refuses `expose` on a
# Lemmas, Proofs, ToMathlib or Main layer). Solution and Test also have it: they are leaves (nothing imports them),
# so exposure there costs no rebuild. `protected`: not trusted, but `trusted_paths` must cover its files (the tag
# freezes their text; check-boundaries.py). An empty layer is allowed.
[[layer]]
name = "Init"
prefixes = ["ConsensusLean.Init"]
allow = []
trusted = true
about = "curated public imports every module reaches (linters, tactics); no options"

[[layer]]
name = "ToMathlib"
prefixes = ["ConsensusLean.ToMathlib"]
allow = []
trusted = true
about = "general lemmas staged for upstreaming; imports only Mathlib"

[[layer]]
name = "Core"
prefixes = ["ConsensusLean.Core"]
expose = true
allow = ["Init", "ToMathlib"]
trusted = true
about = "generic definitions below Spec; none split out yet"

[[layer]]
name = "Spec"
prefixes = ["ConsensusLean.Spec"]
expose = true
allow = ["Init", "ToMathlib", "Core"]
trusted = true
about = "generic definitions and contract"

[[layer]]
name = "Statements"
prefixes = ["ConsensusLean.Statements"]
expose = true
allow = ["Init", "ToMathlib", "Core", "Spec"]
trusted = true
about = "generic milestone and review statements as Props"

[[layer]]
name = "Lemmas"
prefixes = ["ConsensusLean.Lemmas"]
sorry = true
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements"]
about = "generic proof support, including derived definitions outside the trusted surface"

[[layer]]
name = "Proofs.Behaviour"
prefixes = ["ConsensusLean.Proofs.Behaviour"]
sorry = true
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements", "Lemmas"]
about = "milestone: shape claims give the L0 Behaviour (refinement)"

[[layer]]
name = "Proofs.RegimesRealizable"
prefixes = ["ConsensusLean.Proofs.RegimesRealizable"]
sorry = true
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements", "Lemmas"]
about = "milestone: RegimesRealizable"

[[layer]]
name = "Proofs.Faithful"
prefixes = ["ConsensusLean.Proofs.Faithful"]
sorry = true
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements", "Lemmas"]
about = "milestone: LogFaithful and HeldIffServed"

[[layer]]
name = "Main"
prefixes = ["ConsensusLean.Main"]
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements", "Lemmas", "Proofs.Behaviour",
         "Proofs.RegimesRealizable", "Proofs.Faithful"]
about = "generic composition of the milestones (ShapeObligations.correct) and its corollaries"

# Goldilocks: components by level.
# No FG layer allows AC or SA and no AC/SA layer allows an FG layer (they meet only in Spec.Frame and
# Milestones.Spec.Trace); Milestones.Statements.FG allows only the chain-level FG; Milestones.Statements.ComposeAnyAC
# states C0.* for any AC; Spec.Run never allows AsChainShape, Simulation or
# Obligations. Each allow is the full downward closure.
# The protected layers (Spec.*, AsChainShape, Statements.Obligations) hold what the six Challenge statements reach;
# each Milestones.<L> layer (untrusted, docs/decisions.md §"Trusted surface and Challenge scope") mirrors the old layer <L>: the milestone
# statements and the instance Spec only they reach, with <L>'s allow list plus <L> itself and the Milestones copy of
# each entry.
# Spec.FG is one prefix per file (so Spec.FG.Store is its own layer): a new chain-level FG file needs its own line.
# In no layer, so they cannot exist: Spec/FG.lean, Statements/Compose.lean, Instances/Goldilocks/{Spec,Statements}.lean,
# Instances/Goldilocks/Milestones{,/Spec,/Statements}.lean.
[[layer]]
name = "Instances.Goldilocks.Spec.Common"
prefixes = ["ConsensusLean.Instances.Goldilocks.Spec.Common"]
expose = true
allow = ["Init", "ToMathlib", "Core", "Spec"]
protected = true
about = "blocks (parametric in the FG and AC payloads), tree, params, validators"

[[layer]]
name = "Instances.Goldilocks.Spec.FG"
prefixes = ["ConsensusLean.Instances.Goldilocks.Spec.FG.State", "ConsensusLean.Instances.Goldilocks.Spec.FG.Client",
         "ConsensusLean.Instances.Goldilocks.Spec.FG.Slashing"]
expose = true
allow = ["Init", "ToMathlib", "Core", "Spec", "Instances.Goldilocks.Spec.Common"]
protected = true
about = "FG chain level, pure: state transition, client, slashing (one prefix per file, so Spec.FG.Store is its own layer)"

