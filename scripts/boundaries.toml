# Reviewed deviations from the layer matrix, each a debt with its reason. An exception lets the modules
# under `from` import the modules under `to` (a milestone only through its `Main`), and so depend on what
# those reach, through their own exceptions too; it does not extend to the importers of the `from` modules.
# None may start in a
# trusted layer, and every `from` and `to` entry must be used (a fixed deviation must be removed).

# Settings of scripts/check.sh (check-boundaries.py reads only proofs_component_prefixes and trusted_paths).
[checks]
# The Spec surface is every module of a `trusted` layer above: the persisted-extension whitelist
# (scripts/spec-extensions.txt), the snapshot (scripts/spec-snapshot.txt), `theorems`, grep 7b and the
# trusted-file list of docs/definition.md (step 12) cover each of them (their closure stays inside the trusted layers), so no module list
# is kept by hand.
# Module prefixes where a `Proofs` component is allowed (check-decls exempts definitions in modules with a
# `Proofs` component from reaches-opaque: sound only where no trusted module can reach them, which
# check-boundaries.py checks). The plan's milestone proofs, `ConsensusLean/Proofs/<M>/` and
# `ConsensusLean/Instances/Goldilocks/Proofs/<M>/`.
proofs_component_prefixes = ["ConsensusLean.Proofs", "ConsensusLean.Instances.Goldilocks.Proofs"]
# Modules with descendants that may own constants. leanchecker expands a module name as a prefix, so such a
# module would not be replayed by leanchecker (step 5), only by `lake check` (step 10, where bwrap exists).
# None: every parent owns nothing.
noconst_exempt = []
# `theorems` gate: "report" or "enforce". Enforced: a ranged theorem in a Spec module must be listed in
# scripts/spec-theorems.txt.
theorems_mode = "enforce"
# The file that pins the review theorems' types and axioms (#guard_msgs, alpha-equality guards); it must be
# imported directly by `review_root`.
review_axioms_module = "ConsensusLeanTest.ReviewAxioms"
review_root = "ConsensusLeanTest"
# Comparator. Step 9 checks comparator.json against these modules and against the closed Prop
# definitions of `statements_module` (the review statements, paired with their source theorems by
# `review_axioms_module`) and of `milestone_statements_modules` (today the Goldilocks obligations endpoint alone: a
# statements module under `trusted_paths` whose closed Prop definitions `Solution` proves directly; docs/decisions.md
# §"Trusted surface and Challenge scope"); the challenge imports exactly these modules, in this order. Step 11 runs `lake comparator` (where bwrap exists).
challenge_module = "Challenge"
solution_module = "Solution"
statements_module = "ConsensusLean.Statements.Review"
milestone_statements_modules = ["ConsensusLean.Instances.Goldilocks.Statements.Obligations"]
# The proved milestones that are not Challenge statements (docs/decisions.md §"Trusted surface and Challenge scope"): their statements live in
# the untrusted Milestones layers, and step 3b gates the import closure of each entry module below like the
# solution's (no sorry, only the three standard axioms); ConsensusLeanTest.MilestoneAxioms pins their theorems.
proved_milestone_modules = ["ConsensusLean.Instances.Goldilocks.Proofs.FGSafety.Main",
                            "ConsensusLean.Instances.Goldilocks.Proofs.ACSteps.Main",
                            "ConsensusLean.Instances.Goldilocks.Proofs.Growing.AC.Main",
                            "ConsensusLean.Instances.Goldilocks.Proofs.FGStore.Main",
                            "ConsensusLean.Instances.Goldilocks.Proofs.ACBase.Main",
                            "ConsensusLean.Instances.Goldilocks.Proofs.ComposeAnyAC.Main",
                            "ConsensusLean.Instances.Goldilocks.Proofs.Persist.Main",
                            "ConsensusLean.Instances.Goldilocks.Proofs.Regimes.Main",
                            "ConsensusLean.Instances.Goldilocks.Proofs.Service.Main",
                            "ConsensusLean.Instances.Goldilocks.Proofs.Healing.Main",
                            "ConsensusLean.Instances.Goldilocks.Proofs.Growing.FGStore.Main",
                            "ConsensusLean.Instances.Goldilocks.Lemmas.Healing.Recovery.Reports"]
# Extra targets built by step 1 next to the default targets.
extra_build_targets = ["ConsensusLeanTest", "Solution", "CheckFixtures", "CheckDeclsTest", "check-decls", "axiom-audit",
                       "spec-surface", "Challenge"]
# Rebuild canary (check.sh step 14, a report): the proof-only edit `canary_proof_edit` = [old, new] (old
# occurring exactly once) of `canary_module` must leave its .olean.hash unchanged and every default target up to
# date; the control `canary_statement_edit` (a statement change that every use still elaborates with: an extra
# instance argument) must make them stale.
canary_module = "ConsensusLean.Lemmas.Blocks.Facts"
canary_proof_edit = ["  unfold slotTime; push_cast; ring", "  have _canary : True := trivial; unfold slotTime; push_cast; ring"]
canary_statement_edit = ["theorem slotTime_add (s j : Slot) :",
                         "theorem slotTime_add (s j : Slot) [Inhabited Unit] :"]
# Step 12 (cited names, checkdecls-style): every `Consensus.…` token in these docs (prose and code) must
# be a plain name listed in `name_index_module` (a module of a test library) as `example := ``Name`, a resolved
# name literal; building it (`lake test`) checks that each is a declaration.
doc_name_files = ["docs/roadmap.md", "docs/goldilocks-mapping.md"]
name_index_module = "ConsensusLeanTest.Index"
# The trusted surface: scripts/review-boundary.sh (ci.yml, push-main.sh) requires a `Trusted-surface:` line in every
# commit that touches these paths (it reads this list at HEAD and at the base, and checks their union, as literal
# paths), and records each such commit's paths in the summary of the `check` run. Not an approval gate.
# check-boundaries.py requires plain relative paths that cover the file of every module of a trusted layer:
# each prefix of those layers as a file and as a directory. TRUST.md describes them.
trusted_paths = ["ConsensusLean/Init.lean", "ConsensusLean/Init", "ConsensusLean/Core.lean", "ConsensusLean/Core",
                 "ConsensusLean/Spec.lean", "ConsensusLean/Spec", "ConsensusLean/Statements.lean",
                 "ConsensusLean/Statements", "ConsensusLean/ToMathlib.lean", "ConsensusLean/ToMathlib",
                 "Challenge.lean", "comparator.json", "lean-toolchain", "lake-manifest.json",
                 "ConsensusLeanTest/ReviewAxioms.lean", "ConsensusLeanTest/ReviewGuard.lean",
                 # Instance semantics and statements: for every protocol instance P
                 # (today Goldilocks), Instances/P/{Spec,Statements} as file and directory and
                 # Instances/P/AsChainShape.lean, existing or not. The layers marked `protected` must be covered
                 # (check-boundaries.py). The Shape examples (ConsensusLean/Examples) are not instances and are not
                 # listed (docs/decisions.md §"Trusted surface and Challenge scope").
                 "ConsensusLean/Instances/Goldilocks/Spec.lean",
                 "ConsensusLean/Instances/Goldilocks/Spec", "ConsensusLean/Instances/Goldilocks/Statements.lean",
                 "ConsensusLean/Instances/Goldilocks/Statements",
                 "ConsensusLean/Instances/Goldilocks/AsChainShape.lean"]
