# The one configuration file of scripts/check-boundaries.py, scripts/check.sh, scripts/metrics-baseline.py and
# CI's review-boundary job. Every library path, module prefix, layer and module name of the project lives here,
# so a change of layout (a move of files) edits this file and nothing else in the check stack (fixtures aside).
#
# Layout (foundation plan §1): one certified library `ConsensusLean` whose layers are module prefixes, the tests
# `ConsensusLeanTest` (lake test) and the comparator solution `Solution`. Import rules (plan §2): the [[layer]]
# matrix below, checked at source level by scripts/check-boundaries.py (its docstring has every rule).
# Deviations from the plan's matrix are the [[exception]] entries at the end, each with its reason.

# Top-level module names that may be imported from outside the project.
base = ["Init", "Std", "Lean", "Lake", "Mathlib", "Batteries", "Aesop", "Qq", "ProofWidgets",
        "Plausible", "ImportGraph", "LeanSearchClient"]

# Non-default libraries (fixtures, deliberately bad, and the comparator challenge, which holds `sorry`).
# No checked library may import them.
fixture_libs = ["CheckFixtures", "CheckDeclsTest", "Challenge"]

# lean_exe targets of the lakefile (the check stack's tools) and the lean_lib targets only they use. Every
# lakefile target is a [[lib]] below, a fixture lib or one of these; no lib root, glob or file may take a
# top-level name of `base`. No checked module may import a tool module (an unknown top-level name).
tool_exes = ["check-decls", "axiom-audit"]
tool_libs = ["AxiomAudit"]

# Every module (except a generated root) reaches this one through public imports (plan §1, CSLib Init).
init_module = "ConsensusLean.Init"
# Module prefixes exempt from the Init chain: ToMathlib imports only Mathlib (plan §1); ReviewGuard is a meta
# tool on `Lean` alone, shared with the fixtures of check.sh step 6.
init_exempt = ["ConsensusLean.ToMathlib", "ConsensusLeanTest.ReviewGuard"]
# Every directory <parent>.<M> below is one milestone layer, imported from other layers only through
# <parent>.<M>.Main (plan §2: Main may import every Proofs.<M>.Main; Proofs.<N>.Main only by an exception).
milestone_parents = ["ConsensusLean.Proofs"]
# Umbrella imports (plan §0 rule 3d): import the modules you need.
forbidden_imports = ["Mathlib"]

# The checked libraries. A lib's root module is its name, and its name is its check-decls scope (step 3).
# `default`: exactly the lakefile defaultTargets. `test_driver`: the lakefile testDriver.
# `root_lists_all`: the lib is the root plus every file under its directory, and the root (generated:
# `lake exe mk_all --lib <name> --module`) imports every other module; otherwise the lib is one module.
[[lib]]
name = "ConsensusLean"
default = true
root_lists_all = true

[[lib]]
name = "ConsensusLeanTest"
test_driver = true
root_lists_all = true

[[lib]]
name = "Solution"

# The layer matrix (plan §2). A module is in the layer whose prefix covers it (prefixes never overlap).
# `allow`: the other layers it may import directly, written out in full (the checker requires the lists to
# be downward-closed, so this row also bounds everything the layer reaches). `trusted`: the Spec surface
# (snapshot, extensions, theorems, grep 7b, the README file list, trusted_paths); it allows only trusted
# layers. `sorry`: unfinished proofs may stay here (plan §5: only Lemmas and Proofs, never a trusted layer;
# check.sh steps 3 and 7 fail a `sorry` anywhere else, and step 3b fails one in the closure of the solution). Tests: `may_import_roots` (the generated roots,
# import-only aggregates) and `may_import_all`. `expose`: `@[expose]` may appear here (plan §3: whole-file expose
# in Core, Spec, Statements and the instance Spec/Statements layers; none in Lemmas, Proofs, Main and ToMathlib,
# where a definition used elsewhere gets characterising lemmas instead; check-boundaries.py refuses `expose` on a
# Lemmas, Proofs, ToMathlib or Main layer). Solution and Test also have it: they are leaves (nothing imports them),
# so exposure there costs no rebuild. `protected`: not trusted, but `trusted_paths` must cover its files (the tag
# freezes their text; check-boundaries.py). An empty layer is allowed.
[[layer]]
name = "Init"
prefixes = ["ConsensusLean.Init"]
allow = []
trusted = true
about = "curated public imports every module reaches (linters, tactics); no options"

[[layer]]
name = "ToMathlib"
prefixes = ["ConsensusLean.ToMathlib"]
allow = []
trusted = true
about = "general lemmas staged for upstreaming; imports only Mathlib"

[[layer]]
name = "Core"
prefixes = ["ConsensusLean.Core"]
expose = true
allow = ["Init", "ToMathlib"]
trusted = true
about = "generic definitions below Spec; none split out yet"

[[layer]]
name = "Spec"
prefixes = ["ConsensusLean.Spec"]
expose = true
allow = ["Init", "ToMathlib", "Core"]
trusted = true
about = "generic definitions and contract"

[[layer]]
name = "Statements"
prefixes = ["ConsensusLean.Statements"]
expose = true
allow = ["Init", "ToMathlib", "Core", "Spec"]
trusted = true
about = "generic milestone and review statements as Props"

[[layer]]
name = "Lemmas"
prefixes = ["ConsensusLean.Lemmas"]
sorry = true
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements"]
about = "generic proof support, including derived definitions outside the trusted surface"

[[layer]]
name = "Proofs.Behaviour"
prefixes = ["ConsensusLean.Proofs.Behaviour"]
sorry = true
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements", "Lemmas"]
about = "milestone: shape claims give the L0 Behaviour (refinement)"

[[layer]]
name = "Proofs.RegimesRealizable"
prefixes = ["ConsensusLean.Proofs.RegimesRealizable"]
sorry = true
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements", "Lemmas"]
about = "milestone: RegimesRealizable"

[[layer]]
name = "Proofs.Faithful"
prefixes = ["ConsensusLean.Proofs.Faithful"]
sorry = true
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements", "Lemmas"]
about = "milestone: LogFaithful and HeldIffServed"

[[layer]]
name = "Main"
prefixes = ["ConsensusLean.Main"]
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements", "Lemmas", "Proofs.Behaviour", "Proofs.RegimesRealizable",
         "Proofs.Faithful"]
about = "generic composition of the milestones (Accepted.good) and its corollaries"

[[layer]]
name = "Instances.Goldilocks.Spec"
prefixes = ["ConsensusLean.Instances.Goldilocks.Spec"]
expose = true
allow = ["Init", "ToMathlib", "Core", "Spec"]
protected = true
about = "Goldilocks semantics and pinned contract"

[[layer]]
name = "Instances.Goldilocks.Statements"
prefixes = ["ConsensusLean.Instances.Goldilocks.Statements"]
expose = true
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements", "Instances.Goldilocks.Spec"]
protected = true
about = "Goldilocks statements: milestone statements, and the pre-foundation sheet Baseline (not approved; holds its §1 proofs)"

[[layer]]
name = "Instances.Bft.Spec"
prefixes = ["ConsensusLean.Instances.Bft.Spec"]
expose = true
allow = ["Init", "ToMathlib", "Core", "Spec"]
protected = true
about = "the BFT contract shape shared by Streamlet and Tendermint"

[[layer]]
name = "Instances.Streamlet.Spec"
prefixes = ["ConsensusLean.Instances.Streamlet.Spec"]
expose = true
allow = ["Init", "ToMathlib", "Core", "Spec"]
protected = true
about = "Streamlet as a value"

[[layer]]
name = "Instances.Tendermint.Spec"
prefixes = ["ConsensusLean.Instances.Tendermint.Spec"]
expose = true
allow = ["Init", "ToMathlib", "Core", "Spec"]
protected = true
about = "Tendermint as a value"

[[layer]]
name = "Solution"
prefixes = ["Solution"]
expose = true
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements", "Lemmas", "Proofs.Behaviour", "Proofs.RegimesRealizable",
         "Proofs.Faithful", "Main"]
about = "comparator solution: proofs of the review statements (no instances: narrower than plan §2, as before)"

[[layer]]
name = "Test"
prefixes = ["ConsensusLeanTest"]
expose = true
allow = ["Init", "ToMathlib", "Core", "Spec", "Statements", "Lemmas", "Proofs.Behaviour", "Proofs.RegimesRealizable",
         "Proofs.Faithful", "Main", "Instances.Goldilocks.Spec", "Instances.Goldilocks.Statements", "Instances.Bft.Spec",
         "Instances.Streamlet.Spec", "Instances.Tendermint.Spec", "Solution"]
may_import_roots = true
may_import_all = true
about = "tests, review pins (ReviewAxioms, ReviewGuard) and the README index"



# Reviewed deviations from the plan §2 matrix, each a debt with its reason. An exception lets the modules
# under `from` import the modules under `to` (a milestone only through its `Main`), and so depend on what
# those reach, through their own exceptions too (so RegimesRealizable reaches Faithful.Main through exception 2
# then 1, and Streamlet/Tendermint reach Main through 4 then 3); it does not extend to the importers of the
# `from` modules. None may start in a trusted layer, and every `from` and `to` entry must be used (a fixed
# deviation must be removed).
[[exception]]
from = ["ConsensusLean.Lemmas.Shape.Payload", "ConsensusLean.Proofs.Behaviour.Main"]
to = ["ConsensusLean.Proofs.Faithful.Main"]
reason = """Lemmas.Shape.Payload uses the Faithful milestone, and the Behaviour milestone reaches it through
Payload. Plan §2: Lemmas never import Proofs; move the Faithful facts Payload needs down to Lemmas, or state
Behaviour as Faithful -> Behaviour (plan §4)."""

[[exception]]
from = ["ConsensusLean.Proofs.RegimesRealizable.Main"]
to = ["ConsensusLean.Proofs.Behaviour.Main"]
reason = """RegimesRealizable builds on the Behaviour milestone (plan §0 rule 1b: a reviewed cross-milestone
import; plan §4 would state it as Behaviour -> RegimesRealizable in RegimesRealizable's Main)."""

[[exception]]
from = ["ConsensusLean.Instances.Goldilocks.Spec.Baseline", "ConsensusLean.Instances.Goldilocks.Statements.Baseline",
        "ConsensusLean.Instances.Bft.Spec"]
to = ["ConsensusLean.Main"]
reason = """The instance Specs are values of the generic contract and import the generic Main (Accepted.good and
its corollaries). Plan §2: Instances.P.Spec imports only generic Core and Spec, and the link to the contract
is the refinement milestone (Instances.P.Refinement.Defs + Proofs); until that layer lands. For Goldilocks only the
pre-foundation Baseline modules: an exception does not extend to their importers, so a milestone statement that
imported a Baseline module would fail the closure walk (it must not depend on Main or Lemmas, which the tag does not
cover)."""

[[exception]]
from = ["ConsensusLean.Instances.Streamlet.Spec", "ConsensusLean.Instances.Tendermint.Spec"]
to = ["ConsensusLean.Instances.Bft.Spec"]
reason = """Streamlet and Tendermint share the BFT contract shape of Instances.Bft. Plan §2: an instance never
imports another; shared material moves down to the generic layers."""

# Settings of scripts/check.sh (check-boundaries.py reads only proofs_component_prefixes and trusted_paths).
[checks]
# The Spec surface is every module of a `trusted` layer above: the persisted-extension whitelist
# (scripts/spec-extensions.txt), the snapshot (scripts/spec-snapshot.txt), `theorems`, grep 7b and the README
# file list (step 12) cover each of them (their closure stays inside the trusted layers), so no module list
# is kept by hand.
# Module prefixes where a `Proofs` component is allowed (check-decls exempts definitions in modules with a
# `Proofs` component from reaches-opaque: sound only where no trusted module can reach them, which
# check-boundaries.py checks). The plan's milestone proofs, `ConsensusLean/Proofs/<M>/`.
proofs_component_prefixes = ["ConsensusLean.Proofs"]
# Modules with descendants that may own constants. leanchecker expands a module name as a prefix, so such a
# module would not be replayed by leanchecker (step 5), only by `lake check` (step 10, where bwrap exists).
# None: every parent owns nothing.
noconst_exempt = []
# `theorems` gate: "report" or "enforce". Enforced: a ranged theorem in a Spec module must be listed in
# scripts/spec-theorems.txt.
theorems_mode = "enforce"
# The file that pins the review theorems' types and axioms (#guard_msgs, alpha-equality guards); it must be
# imported directly by `review_root`.
review_axioms_module = "ConsensusLeanTest.ReviewAxioms"
review_root = "ConsensusLeanTest"
# Comparator (plan §3). Step 9 checks comparator.json against these modules and against the Prop
# definitions of `statements_module`; step 11 runs `lake comparator` (where bwrap exists).
challenge_module = "Challenge"
solution_module = "Solution"
statements_module = "ConsensusLean.Statements.Review"
# Extra targets built by step 1 next to the default targets.
extra_build_targets = ["ConsensusLeanTest", "Solution", "CheckFixtures", "CheckDeclsTest", "check-decls", "axiom-audit",
                       "Challenge"]
# Rebuild canary (plan §6; check.sh step 14, a report): the proof-only edit `canary_proof_edit` = [old, new] (old
# occurring exactly once) of `canary_module` must leave its .olean.hash unchanged and every default target up to
# date; the control `canary_statement_edit` (a statement change that every use still elaborates with: an extra
# instance argument) must make them stale.
canary_module = "ConsensusLean.Lemmas.Blocks.Facts"
canary_proof_edit = ["  unfold slotTime; push_cast; ring", "  have _canary : True := trivial; unfold slotTime; push_cast; ring"]
canary_statement_edit = ["theorem slotTime_add {Δ : Time} (s j : Slot) :",
                         "theorem slotTime_add {Δ : Time} (s j : Slot) [Inhabited Unit] :"]
# Step 12 (cited names, checkdecls-style; plan §4): every `Consensus.…` token in these docs (prose and code) must
# be a plain name listed in `name_index_module` (a module of a test library) as `example := ``Name`, a resolved
# name literal; building it (`lake test`) checks that each is a declaration.
doc_name_files = ["docs/roadmap.md", "docs/goldilocks-mapping.md"]
name_index_module = "ConsensusLeanTest.Index"
# Step 12: .github/CODEOWNERS lists exactly `trusted_paths` and these paths, each owned by `code_owner`. Code Owner
# review is not enforced (issue #21: infrastructure is agent-reviewed); the entries name the owner (plan §4).
code_owner = "@fradamt"
codeowners_extra = ["scripts", ".github", "lakefile.toml", "lakefile.lean", "docs/goldilocks-mapping.md"]
# The trusted surface: CI's review-boundary job (ci.yml) fails on any difference of these paths from the tag
# `spec-approved` (it reads this list at the PR head and at the tag, and checks their union, as literal paths).
# check-boundaries.py requires plain relative paths that cover the file of every module of a trusted layer:
# each prefix of those layers as a file and as a directory. .github/CODEOWNERS lists exactly these paths (check.sh
# step 12, with `codeowners_extra`); docs/spec-review.md records them.
trusted_paths = ["ConsensusLean/Init.lean", "ConsensusLean/Init", "ConsensusLean/Core.lean", "ConsensusLean/Core",
                 "ConsensusLean/Spec.lean", "ConsensusLean/Spec", "ConsensusLean/Statements.lean",
                 "ConsensusLean/Statements", "ConsensusLean/ToMathlib.lean", "ConsensusLean/ToMathlib",
                 "Challenge.lean", "comparator.json", "lean-toolchain", "lake-manifest.json",
                 "ConsensusLeanTest/ReviewAxioms.lean", "ConsensusLeanTest/ReviewGuard.lean",
                 # Instance semantics and statements (#38; foundation plan §1, §4): for every instance P,
                 # Instances/P/{Spec,Statements} as file and directory and Instances/P/Refinement/Defs.lean,
                 # existing or not. The layers marked `protected` must be covered (check-boundaries.py).
                 # Lemmas/Problem/Derived.lean: the definitions the Goldilocks Baseline sheet reads (FaultsBelow,
                 # Safe, ReadySafeUpTo), so that no unreviewed edit changes what the sheet says.
                 "ConsensusLean/Lemmas/Problem/Derived.lean",
                 "ConsensusLean/Instances/Bft/Spec.lean", "ConsensusLean/Instances/Bft/Spec",
                 "ConsensusLean/Instances/Bft/Statements.lean", "ConsensusLean/Instances/Bft/Statements",
                 "ConsensusLean/Instances/Bft/Refinement/Defs.lean", "ConsensusLean/Instances/Goldilocks/Spec.lean",
                 "ConsensusLean/Instances/Goldilocks/Spec", "ConsensusLean/Instances/Goldilocks/Statements.lean",
                 "ConsensusLean/Instances/Goldilocks/Statements",
                 "ConsensusLean/Instances/Goldilocks/Refinement/Defs.lean",
                 "ConsensusLean/Instances/Streamlet/Spec.lean", "ConsensusLean/Instances/Streamlet/Spec",
                 "ConsensusLean/Instances/Streamlet/Statements.lean", "ConsensusLean/Instances/Streamlet/Statements",
                 "ConsensusLean/Instances/Streamlet/Refinement/Defs.lean",
                 "ConsensusLean/Instances/Tendermint/Spec.lean", "ConsensusLean/Instances/Tendermint/Spec",
                 "ConsensusLean/Instances/Tendermint/Statements.lean",
                 "ConsensusLean/Instances/Tendermint/Statements",
                 "ConsensusLean/Instances/Tendermint/Refinement/Defs.lean"]
