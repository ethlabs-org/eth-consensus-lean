# The one configuration file of scripts/check.sh and scripts/check-imports.py.
# Every library path, module prefix and module name of the project lives here, so a change of layout
# (the B2/B3 moves) edits this file and nothing else in the check stack (fixture paths aside).
# Protected path: changes are reviewed by the owner.
#
# Layout: the CURRENT (pre-move) six libraries. The rules below encode the layering that holds today,
# measured with `lean --deps-json`; B2/B3 replace them with R1-R3 of the plan.

# R1 base set: top-level module names that may be imported from outside the project.
base = ["Init", "Std", "Lean", "Lake", "Mathlib", "Batteries", "Aesop", "Qq", "ProofWidgets",
        "Plausible", "ImportGraph", "LeanSearchClient"]

# Non-default libraries (fixtures, deliberately bad). No default library may import them.
fixture_libs = ["CheckFixtures", "CheckDeclsTest"]

# lean_exe targets of the lakefile (the check stack's tools). Every lakefile target is a [[lib]] below, a
# fixture lib or one of these; no lib root, glob or file may take a top-level name of `base`.
tool_exes = ["check-decls"]

# One [[lib]] per default target of lakefile.toml (asserted). `allow`: module prefixes that the import
# closure of every module of the library may contain. `root_covers` must be true: every file under `dir`
# is reached from the root. `may_import_roots`: non-root modules may import another library's root
# (pre-move layout only; removed in B2/B3, except for tests).
[[lib]]
name = "ConsensusProblem"
root = "ConsensusProblem"
dir = "ConsensusProblem"
allow = ["ConsensusProblem"]
root_covers = true

[[lib]]
name = "ConsensusModel"
root = "ConsensusModel"
dir = "ConsensusModel"
allow = ["ConsensusModel", "ConsensusProblem"]
root_covers = true
may_import_roots = true   # ConsensusModel.System imports ConsensusProblem (pre-move)

[[lib]]
name = "ConsensusModelProofs"
root = "ConsensusModelProofs"
dir = "ConsensusModelProofs"
allow = ["ConsensusModelProofs", "ConsensusModel", "ConsensusProblem"]
root_covers = true

[[lib]]
name = "ConsensusBlocks"
root = "ConsensusBlocks"
dir = "ConsensusBlocks"
allow = ["ConsensusBlocks", "ConsensusModel", "ConsensusProblem"]
root_covers = true

[[lib]]
name = "ConsensusShape"
root = "ConsensusShape"
dir = "ConsensusShape"
allow = ["ConsensusShape", "ConsensusBlocks", "ConsensusModel", "ConsensusModelProofs", "ConsensusProblem"]
root_covers = true
may_import_roots = true   # ConsensusShape.{Run,Shape} import library roots (pre-move)

[[lib]]
name = "ConsensusShapeTests"
root = "ConsensusShapeTests"
dir = "ConsensusShapeTests"
allow = ["ConsensusShapeTests", "ConsensusShape", "ConsensusBlocks", "ConsensusModel",
         "ConsensusModelProofs", "ConsensusProblem"]
root_covers = true
may_import_roots = true   # tests

# Settings of scripts/check.sh (ignored by check-imports.py).
[checks]
# The Spec modules: the snapshot (scripts/spec-snapshot.txt), `theorems` and grep 7b cover exactly these.
# Pre-move: the 21 intended-trusted modules.
spec_modules = [
  "ConsensusProblem.Basic", "ConsensusProblem.Network", "ConsensusProblem.Properties",
  "ConsensusProblem.Regimes", "ConsensusProblem.Good",
  "ConsensusModel.Objects", "ConsensusModel.Protocol", "ConsensusModel.Run", "ConsensusModel.Conditions",
  "ConsensusModel.System",
  "ConsensusBlocks.TimeGrid", "ConsensusBlocks.Progress", "ConsensusBlocks.Chains", "ConsensusBlocks.Payload",
  "ConsensusShape.Shape", "ConsensusShape.Compile", "ConsensusShape.Run", "ConsensusShape.Claims",
  "ConsensusShape.ProgressFit", "ConsensusShape.Realizable", "ConsensusShape.Accepted",
]
# Libraries whose every module is held to the persisted-extension whitelist (scripts/spec-extensions.txt).
extension_libs = ["ConsensusProblem", "ConsensusModel", "ConsensusBlocks", "ConsensusShape"]
# Modules with descendants that own constants. leanchecker expands a module name as a prefix, so such a
# module is not replayed by leanchecker (step 5) but by `lake check` (step 10, where bwrap exists); every
# other parent must own nothing.
# ConsensusModelProofs.Canonical (Canonical.lean next to Canonical/) owns 8 constants (proofs).
noconst_exempt = ["ConsensusModelProofs.Canonical"]
# `theorems` gate: "report" (pre-move: Spec modules still hold proofs) or "enforce" (from B3).
theorems_mode = "report"
# The file that pins the review theorems' axioms (#guard_msgs); it must be imported by `review_root`.
review_axioms_module = "ConsensusShapeTests.ReviewAxioms"
review_root = "ConsensusShapeTests"
# Comparator (plan §3; comparator.json and these modules exist from B4). Step 9 checks comparator.json
# against them and against the Prop definitions of `statements_module`.
challenge_module = "ConsensusChallenge"
solution_module = "ConsensusProofs.Review"
statements_module = "ConsensusSpec.Statements"
# Extra targets built by step 1 next to the default targets.
extra_build_targets = ["CheckFixtures", "CheckDeclsTest", "check-decls"]
