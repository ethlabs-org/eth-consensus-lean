# Target layer (foundation plan §1–§2, workbench consensus-lean/plans/foundation-plan.md) of every module
# of the lakefile targets. Read only by scripts/metrics-baseline.py (report-only; nothing gates on it).
# Step 2 (#5) moves modules to these layers; step 3 (#6) turns this map into the boundary checker's
# config, after which this file goes away. Module paths stay in lakefile.toml / boundaries.toml.
#
# Lookup: an [exact] module name first, else the longest [prefix] (component-wise: A covers A and A.x).
# The script fails on a module with no rule, a rule naming an unknown layer, and a rule matching nothing.
# Layers outside the certified library (plan §1); with Aggregate, left out of the library depth.
non_library = ["Test", "Challenge", "Solution", "Tool"]

[layers]  # name = meaning (an empty layer is allowed)
"Core" = "generic definitions below Spec (plan §1); none split out yet"
"Spec" = "generic definitions and contract (trusted)"
"Statements" = "generic milestone / review statements as Props (trusted)"
"Lemmas" = "generic proof support, including derived definitions outside the trusted surface"
"Proofs.Behaviour" = "milestone proof: shape claims give the L0 Behaviour (refinement)"
"Proofs.RegimesRealizable" = "milestone proof: RegimesRealizable"
"Proofs.Faithful" = "milestone proof: LogFaithful and HeldIffServed"
"Main" = "generic composition of the milestones (Accepted.good) and its corollaries"
"Instances.Goldilocks.Spec" = "Goldilocks semantics and pinned contract"
"Instances.Goldilocks.Statements" = "Goldilocks reviewed target (the properties sheet; also holds its §1 proofs)"
"Instances.Bft.Spec" = "the BFT contract shape shared by Streamlet and Tendermint (plan §2: shared material moves down)"
"Instances.Streamlet.Spec" = "Streamlet as a value"
"Instances.Tendermint.Spec" = "Tendermint as a value"
"Test" = "tests, review pins (ReviewAxioms, ReviewGuard) and the README index"
"Challenge" = "comparator challenge (non-default)"
"Solution" = "comparator solution: proofs of the review statements"
"Aggregate" = "import-only library roots and folder aggregates; replaced by the generated root (step 2)"
"Tool" = "check stack under scripts/: the check-decls exe and its fixtures, and CheckFixtures (plan: fixtures go to the test library)"

[exact]
"ConsensusSpec" = "Aggregate"
"ConsensusProofs" = "Aggregate"
"ConsensusInstances" = "Aggregate"
"ConsensusTests" = "Aggregate"
"ConsensusProofs.Problem" = "Aggregate"
"ConsensusProofs.Model" = "Aggregate"
"ConsensusProofs.Model.Canonical" = "Aggregate"
"ConsensusProofs.Shape" = "Aggregate"
"ConsensusSpec.Statements" = "Statements"
"ConsensusProofs.Model.Faithful" = "Proofs.Faithful"
"ConsensusProofs.Shape.Refinement" = "Proofs.Behaviour"
"ConsensusProofs.Shape.Realizable" = "Proofs.RegimesRealizable"
"ConsensusProofs.Shape.Accepted" = "Main"
"ConsensusProofs.Shape.Service" = "Main"
"ConsensusProofs.Shape.Payload" = "Lemmas"
"ConsensusProofs.Review" = "Solution"
"ConsensusInstances.Goldilocks" = "Instances.Goldilocks.Spec"
"ConsensusInstances.GoldilocksSheet" = "Instances.Goldilocks.Statements"
"ConsensusInstances.Bft" = "Instances.Bft.Spec"
"ConsensusInstances.Streamlet" = "Instances.Streamlet.Spec"
"ConsensusInstances.Tendermint" = "Instances.Tendermint.Spec"
"ConsensusChallenge" = "Challenge"

[prefix]
"ConsensusSpec.Problem" = "Spec"
"ConsensusSpec.Model" = "Spec"
"ConsensusSpec.Blocks" = "Spec"
"ConsensusSpec.Shape" = "Spec"
"ConsensusProofs.Problem" = "Lemmas"
"ConsensusProofs.Blocks" = "Lemmas"
"ConsensusProofs.Model" = "Lemmas"
"ConsensusTests" = "Test"
"CheckDecls" = "Tool"
"CheckDeclsTest" = "Tool"
"CheckDeclsForeign" = "Tool"
"CheckFixtures" = "Tool"

# The module whose theorem proves each milestone; the per-module table lists, for every module, the
# milestones whose proof module reaches it (shared support belongs in Lemmas, plan §4).
[milestones]
AcceptedGood = "ConsensusProofs.Shape.Accepted"
RegimesRealizable = "ConsensusProofs.Shape.Realizable"
Behaviour = "ConsensusProofs.Shape.Refinement"
Faithful = "ConsensusProofs.Model.Faithful"
