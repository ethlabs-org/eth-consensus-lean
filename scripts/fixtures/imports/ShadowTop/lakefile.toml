name = "fx"
defaultTargets = ["FxSpec", "FxImpl"]

[[lean_lib]]
name = "FxSpec"
globs = ["FxSpec.*"]

[[lean_lib]]
name = "FxImpl"
globs = ["FxImpl.*"]

[[lean_lib]]
name = "FxFix"
srcDir = "Fx"
roots = []
globs = ["FxFix.+"]

# Fx/Mathlib/Shadow.lean sits in a srcDir under a base library's name (Mathlib); no lib names it, so only
# the file/directory rule (not the module-prefix rule) can catch it.
