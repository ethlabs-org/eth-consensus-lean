base = ["Init", "Mathlib"]
fixture_libs = ["FxFix"]

[[lib]]
name = "Fx"
default = true
root_lists_all = true

[[lib]]
name = "FxTest"
test_driver = true
root_lists_all = true

[[lib]]
name = "FxSol"

[[group]]
name = "spec"
prefixes = ["Fx.Spec"]
allow = []
trusted = true

[[group]]
name = "impl"
prefixes = ["Fx.Impl", "Fx.Proofs"]
allow = ["spec"]

[[group]]
name = "sol"
prefixes = ["FxSol"]
allow = ["spec", "impl"]

[[group]]
name = "test"
prefixes = ["FxTest"]
allow = ["spec", "impl", "sol"]
may_import_roots = true

[checks]
proofs_component_prefixes = ["Fx.Proofs", "Fx.Spec.Proofs"]
trusted_paths = ["Fx/Spec.lean", "Fx/Spec"]
