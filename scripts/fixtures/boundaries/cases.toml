# The protected surface (check.sh step 4's instance snapshot): a default lib's module covered by trusted_paths
# outside the trusted layers. Selected: a `protected` instance layer's module (Fx.Inst.A) and a covered module of an
# unprotected untrusted layer (Fx.Lemmas.L). Not selected: the trusted layers'
# modules (the Spec snapshot holds them), an uncovered Lemmas module, and a covered module of the test lib.
[ProtectedSurface]
protected = ["Fx.Inst.A", "Fx.Lemmas.L"]
files."Fx/Inst/A.lean" = '''module

public import Fx.Init

def a : Nat := 0
'''
edit."Fx.lean" = [['public import Fx.Init', '''public import Fx.Init
public import Fx.Inst.A''']]
edit."boundaries.toml" = [['''[[layer]]
name = "Lemmas"''', '''[[layer]]
name = "Inst"
prefixes = ["Fx.Inst"]
allow = ["Init", "ToMathlib", "Spec"]
protected = true

[[layer]]
name = "Lemmas"'''], ['trusted_paths = ["Fx/Init.lean", "Fx/ToMathlib", "Fx/Spec", "Fx/Statements"]',
  'trusted_paths = ["Fx/Init.lean", "Fx/ToMathlib", "Fx/Spec", "Fx/Statements", "Fx/Inst", "Fx/Lemmas/L.lean", "FxTest/T.lean"]'],
  ['allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas", "Proofs.P", "Proofs.Q", "Main", "Sol"]',
   'allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas", "Proofs.P", "Proofs.Q", "Main", "Sol", "Inst"]']]

# A `protected` layer allows only trusted and protected layers, so the protected surface never reaches an untrusted
# layer such as the Goldilocks Milestones (docs/decisions.md §"Trusted surface and Challenge scope"); ProtectedSurface is the control.
[ProtectedAllowsUnprotected]
expect = "FAIL[config] protected layer Inst allows the unprotected layer Lemmas"
files."Fx/Inst/A.lean" = '''module

public import Fx.Init

def a : Nat := 0
'''
