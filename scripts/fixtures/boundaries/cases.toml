public import Fx.Inst.A''']]
edit."boundaries.toml" = [['''[[layer]]
name = "Proofs.P"''', '''[[layer]]
name = "Inst"
prefixes = ["Fx.Inst"]
allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas"]
protected = true

[[layer]]
name = "Proofs.P"'''], ['trusted_paths = ["Fx/Init.lean", "Fx/ToMathlib", "Fx/Spec", "Fx/Statements"]',
  'trusted_paths = ["Fx/Init.lean", "Fx/ToMathlib", "Fx/Spec", "Fx/Statements", "Fx/Inst"]'],
