# Cases of `scripts/check-boundaries.py --self-test` (check.sh step 2 self-test). Each case is a copy of
# Good/ (header-only modules, never built) with edits: `delete` (paths), `files` (path = new content) and
# `edit` (path = [[old, new], ...], each old text matching exactly once). `expect`: the start of one finding
# the case must produce; a case without it must pass.

[Good]
protected = []

# --- configuration -------------------------------------------------------------------------------
[MissingConfig]
expect = "FAIL[config] cannot read the boundaries config"
delete = ["boundaries.toml"]

[BadToml]
expect = "FAIL[config] the boundaries config"
edit."boundaries.toml" = [['fixture_libs = ["FxFix"]', 'fixture_libs = ["FxFix"']]

[UnknownKey]
expect = "FAIL[config] [[layer]] Lemmas: unknown key alow"
edit."boundaries.toml" = [['allow = ["Init", "ToMathlib", "Spec", "Statements"]', 'alow = ["Init", "ToMathlib", "Spec", "Statements"]']]

[NoInitModule]
expect = "FAIL[config] init_module"
edit."boundaries.toml" = [['init_module = "Fx.Init"', '']]

[MissingKey]
expect = "FAIL[config] missing top-level key forbidden_imports"
edit."boundaries.toml" = [['forbidden_imports = ["Mathlib"]', '']]

[MisplacedKey]
expect = "FAIL[config] [checks]: unknown key forbidden_imports"
edit."boundaries.toml" = [['forbidden_imports = ["Mathlib"]', ''], ['[checks]', '''[checks]
forbidden_imports = ["Mathlib"]''']]

[ForbiddenTypo]
expect = "FAIL[config] forbidden_imports entry MathLib is not under a base name"
edit."boundaries.toml" = [['forbidden_imports = ["Mathlib"]', 'forbidden_imports = ["MathLib"]']]

[MilestoneParentTypo]
expect = "FAIL[config] milestone_parents entry Fx.Proof meets no layer prefix"
edit."boundaries.toml" = [['milestone_parents = ["Fx.Proofs"]', 'milestone_parents = ["Fx.Proof"]']]

[InitExemptTypo]
expect = "FAIL[config] init_exempt entry Fx.ToMathllib meets no layer prefix"
edit."boundaries.toml" = [['init_exempt = ["Fx.ToMathlib"]', 'init_exempt = ["Fx.ToMathllib"]']]

[EmptyLib]
expect = "FAIL[config] no [[lib]] entries"
files."boundaries.toml" = '''
base = ["Init", "Mathlib"]
init_module = "Fx.Init"

[[layer]]
name = "All"
prefixes = ["Fx"]
allow = []
'''

[DupPrefix]
expect = "FAIL[config] prefix Fx.Spec (layer Lemmas) overlaps Fx.Spec (layer Spec)"
edit."boundaries.toml" = [['prefixes = ["Fx.Lemmas"]', 'prefixes = ["Fx.Lemmas", "Fx.Spec"]']]

[NestedPrefix]
expect = "FAIL[config] prefix Fx.Spec.B (layer Lemmas) overlaps Fx.Spec (layer Spec)"
edit."boundaries.toml" = [['prefixes = ["Fx.Lemmas"]', 'prefixes = ["Fx.Lemmas", "Fx.Spec.B"]']]

[UnknownLayer]
expect = "FAIL[config] layer Test: allow entry Nope is not another layer"
edit."boundaries.toml" = [['"Main", "Sol"]', '"Main", "Sol", "Nope"]']]

[LayerCycle]
expect = "FAIL[config] layer cycle"
edit."boundaries.toml" = [['''prefixes = ["Fx.Init"]
allow = []''', '''prefixes = ["Fx.Init"]
allow = ["Spec"]''']]

[NotClosed]
expect = "FAIL[config] layer Lemmas: allow is not downward-closed: it allows Statements, which allows Init"
edit."boundaries.toml" = [['allow = ["Init", "ToMathlib", "Spec", "Statements"]', 'allow = ["ToMathlib", "Spec", "Statements"]']]

[TrustedAllowsUntrusted]
expect = "FAIL[config] trusted layer Statements allows the untrusted layer Lemmas"
edit."boundaries.toml" = [['''prefixes = ["Fx.Statements"]
allow = ["Init", "ToMathlib", "Spec"]''', '''prefixes = ["Fx.Statements"]
allow = ["Init", "ToMathlib", "Spec", "Lemmas"]''']]

[SorryTrusted]
expect = "FAIL[config] trusted layer Spec allows sorry"
edit."boundaries.toml" = [['prefixes = ["Fx.Spec"]', '''prefixes = ["Fx.Spec"]
sorry = true''']]

# --- visibility ------------------------------------------------------------------------------------
# The fixture modules are never built: the FAIL[expose] cases test what the scanner finds in the text.
[ExposeConfigLemmas]
expect = "FAIL[config] layer Lemmas: expose = true on Lemmas, Proofs, ToMathlib or Main (Fx.Lemmas)"
edit."boundaries.toml" = [['prefixes = ["Fx.Lemmas"]', '''prefixes = ["Fx.Lemmas"]
expose = true''']]

[ExposeConfigType]
expect = "FAIL[config] [[layer]] Spec: expose must be true or false"
edit."boundaries.toml" = [['''allow = ["Init", "ToMathlib"]
trusted = true
expose = true''', '''allow = ["Init", "ToMathlib"]
trusted = true
expose = "yes"''']]

[ExposeSectionInLemmas]
expect = "FAIL[expose] Fx.Lemmas.L: @[expose] in layer Lemmas"
edit."Fx/Lemmas/L.lean" = [['theorem l : S := rfl', '''@[expose] public section
theorem l : S := rfl
end''']]

[ExposeDeclInProofs]
expect = "FAIL[expose] Fx.Proofs.P.Aux: @[expose] in layer Proofs.P"
edit."Fx/Proofs/P/Aux.lean" = [['theorem p0 : S := l', '''@[simp, expose] public def d : Nat := 0
theorem p0 : S := l''']]

[ExposeAttributeInMain]
expect = "FAIL[expose] Fx.Main: @[expose] in layer Main"
edit."Fx/Main.lean" = [['theorem main : S := q', '''attribute [expose] Nat.add
theorem main : S := q''']]

[ExposeInToMathlib]
expect = "FAIL[expose] Fx.ToMathlib.T: @[expose] in layer ToMathlib"
edit."Fx/ToMathlib/T.lean" = [['public import Mathlib.Logic.Basic', '''public import Mathlib.Logic.Basic
@[expose] public section''']]

[ExposeConfigProofs]
expect = "FAIL[config] layer Proofs.P: expose = true on Lemmas, Proofs, ToMathlib or Main (Fx.Proofs.P)"
edit."boundaries.toml" = [['prefixes = ["Fx.Proofs.P"]', '''prefixes = ["Fx.Proofs.P"]
expose = true''']]

[ExposeConfigMain]
expect = "FAIL[config] layer Main: expose = true on Lemmas, Proofs, ToMathlib or Main (Fx.Main)"
edit."boundaries.toml" = [['prefixes = ["Fx.Main"]', '''prefixes = ["Fx.Main"]
expose = true''']]

[ExposeConfigToMathlib]
expect = "FAIL[config] layer ToMathlib: expose = true on Lemmas, Proofs, ToMathlib or Main (Fx.ToMathlib)"
edit."boundaries.toml" = [['prefixes = ["Fx.ToMathlib"]', '''prefixes = ["Fx.ToMathlib"]
expose = true''']]

[ExposeMultiline]
expect = "FAIL[expose] Fx.Lemmas.N: @[expose] in layer Lemmas"
edit."Fx/Lemmas/N.lean" = [['theorem n : S := l', '''@[simp,
  expose] public def d : Nat := 0
theorem n : S := l''']]

[ExposeGuillemets]
expect = "FAIL[expose] Fx.Lemmas.N: @[expose] in layer Lemmas"
edit."Fx/Lemmas/N.lean" = [['theorem n : S := l', '''@[«expose»] public def d : Nat := 0
theorem n : S := l''']]

[ExposeAfterTrickyString]
expect = "FAIL[expose] Fx.Lemmas.N: @[expose] in layer Lemmas"
edit."Fx/Lemmas/N.lean" = [['theorem n : S := l', '''def s : String := "/-"
@[foo "]", expose] public def d : Nat := 0
theorem n : S := l''']]

[ExposeAfterQuotedName]
expect = "FAIL[expose] Fx.Lemmas.N: @[expose] in layer Lemmas"
edit."Fx/Lemmas/N.lean" = [['theorem n : S := l', '''public def «/-» : Nat := 0
public def «"» : Nat := 0
@[expose] public def d : Nat := 0
theorem n : S := l''']]

[SorryOutside]
expect = "FAIL[config] layer Main: sorry = true outside Lemmas and Proofs (Fx.Main)"
edit."boundaries.toml" = [['prefixes = ["Fx.Main"]', '''prefixes = ["Fx.Main"]
sorry = true''']]

[SorryOutsideDefault]
expect = "FAIL[config] layer TestLemmas: sorry = true outside the default libraries (FxTest.Lemmas)"
edit."boundaries.toml" = [['[checks]', '''[[layer]]
name = "TestLemmas"
prefixes = ["FxTest.Lemmas"]
allow = []
sorry = true

[checks]''']]

[SorryNotBool]
expect = "FAIL[config] [[layer]] Lemmas: sorry must be true or false"
edit."boundaries.toml" = [['''prefixes = ["Fx.Lemmas"]
sorry = true''', '''prefixes = ["Fx.Lemmas"]
sorry = "yes"''']]

[TrustedException]
expect = "FAIL[config] exception 2: from Fx.Spec.B meets the trusted layer Spec"
edit."boundaries.toml" = [['[checks]', '''[[exception]]
from = ["Fx.Spec.B"]
to = ["Fx.Lemmas"]
reason = "case"

[checks]''']]
files."Fx/Spec/B.lean" = "module\n\npublic import Fx.Lemmas.L\n"

[StaleException]
expect = "FAIL[config] exception 2 (from ['Fx.Lemmas'] to ['Fx.Main']) covers no import"
edit."boundaries.toml" = [['[checks]', '''[[exception]]
from = ["Fx.Lemmas"]
to = ["Fx.Main"]
reason = "case"

[checks]''']]

[StaleExceptionEntry]
expect = "FAIL[config] exception 1: to entry Fx.Main covers no import"
edit."boundaries.toml" = [['to = ["Fx.Proofs.P.Main"]', 'to = ["Fx.Proofs.P.Main", "Fx.Main"]']]

[ExceptionNoReason]
expect = "FAIL[config] exception 1: no reason"
edit."boundaries.toml" = [['reason = "fixture: milestone Q builds on milestone P"', 'reason = " "']]

# --- layers and milestones -----------------------------------------------------------------------
[Unmapped]
expect = "FAIL[layer] Fx.Other.D: in no layer"
files."Fx/Other/D.lean" = "module\n\npublic import Fx.Spec.A\n"
edit."Fx.lean" = [["public import Fx.Main\n", "public import Fx.Main\npublic import Fx.Other.D\n"]]

[MilestoneUnmapped]
expect = "FAIL[milestone] Fx.Proofs.R.Main: a milestone is a directory Fx.Proofs.<M> with its own layer"
files."Fx/Proofs/R/Main.lean" = "module\n\npublic import Fx.Lemmas.L\n"
edit."Fx.lean" = [["public import Fx.Proofs.Q.Main\n", "public import Fx.Proofs.Q.Main\npublic import Fx.Proofs.R.Main\n"]]

[MilestoneFile]
expect = "FAIL[milestone] Fx.Proofs.R: a milestone is a directory"
files."Fx/Proofs/R.lean" = "module\n\npublic import Fx.Lemmas.L\n"
edit."Fx.lean" = [["public import Fx.Proofs.Q.Main\n", "public import Fx.Proofs.Q.Main\npublic import Fx.Proofs.R\n"]]

[MilestoneCoarse]
expect = "FAIL[config] layer Proofs.P: prefix Fx.Proofs covers the milestone parent Fx.Proofs"
edit."boundaries.toml" = [['prefixes = ["Fx.Proofs.P"]', 'prefixes = ["Fx.Proofs"]']]

[MilestoneNoMain]
expect = "FAIL[milestone] layer Proofs.P has modules but no entry module Fx.Proofs.P.Main"
delete = ["Fx/Proofs/P/Main.lean"]
files."Fx/Proofs/Q/Main.lean" = "module\n\npublic import Fx.Proofs.P.Aux\n\ntheorem q : S := p0\n"
files."Fx/Main.lean" = "module\n\npublic import Fx.Proofs.Q.Main\n\ntheorem main : S := q\n"
edit."Fx.lean" = [["public import Fx.Proofs.P.Main\n", ""]]

# --- imports -------------------------------------------------------------------------------------
[BadImport]
expect = "FAIL[import] Fx.Lemmas.L (layer Lemmas) imported by Fx.Spec.B (layer Spec)"
files."Fx/Spec/B.lean" = "module\n\npublic import Fx.Lemmas.L\n"

# The Recovery.Reports exception is an exact module pair, not a string-prefix grant.
[ExactReportException]
files."Fx/Lemmas/Reports.lean" = "module\n\npublic import Fx.Proofs.P.Main\n"
edit."Fx.lean" = [['public import Fx.Lemmas.N', "public import Fx.Lemmas.N\npublic import Fx.Lemmas.Reports"]]
edit."boundaries.toml" = [['[checks]', '''[[exception]]
from = ["Fx.Lemmas.Reports"]
to = ["Fx.Proofs.P.Main"]
reason = "fixture: one report supplier depends on one operational theorem module"

[checks]''']]

[ExactReportExceptionWrongSource]
expect = "FAIL[import] Fx.Proofs.P.Main (layer Proofs.P) imported by Fx.Lemmas.ReportsExtra (layer Lemmas)"
files."Fx/Lemmas/Reports.lean" = "module\n\npublic import Fx.Proofs.P.Main\n"
files."Fx/Lemmas/ReportsExtra.lean" = "module\n\npublic import Fx.Proofs.P.Main\n"
edit."Fx.lean" = [['public import Fx.Lemmas.N', "public import Fx.Lemmas.N\npublic import Fx.Lemmas.Reports\npublic import Fx.Lemmas.ReportsExtra"]]
edit."boundaries.toml" = [['[checks]', '''[[exception]]
from = ["Fx.Lemmas.Reports"]
to = ["Fx.Proofs.P.Main"]
reason = "fixture: the neighboring report module is not allowed"

[checks]''']]

[ExactReportExceptionWrongTarget]
expect = "FAIL[import] Fx.Proofs.Q.Main (layer Proofs.Q) imported by Fx.Lemmas.Reports (layer Lemmas)"
files."Fx/Lemmas/Reports.lean" = "module\n\npublic import Fx.Proofs.P.Main\npublic import Fx.Proofs.Q.Main\n"
edit."Fx.lean" = [['public import Fx.Lemmas.N', "public import Fx.Lemmas.N\npublic import Fx.Lemmas.Reports"]]
edit."boundaries.toml" = [['[checks]', '''[[exception]]
from = ["Fx.Lemmas.Reports"]
to = ["Fx.Proofs.P.Main"]
reason = "fixture: the neighboring operational module is not allowed"

[checks]''']]

[BadImportTransitive]
expect = "FAIL[import] Fx.Proofs.P.Main (layer Proofs.P) reached from Fx.Lemmas.N -> Fx.Lemmas.M (layer Lemmas)"
files."Fx/Lemmas/M.lean" = "module\n\npublic import Fx.Proofs.P.Main\n\ntheorem m : S := p\n"
files."Fx/Lemmas/N.lean" = "module\n\npublic import Fx.Lemmas.M\n\ntheorem n : S := m\n"
edit."boundaries.toml" = [['[checks]', '''[[exception]]
from = ["Fx.Lemmas.M"]
to = ["Fx.Proofs.P"]
reason = "case: only M may reach P"

[checks]''']]

# A sibling layer that may use the static lemmas and that no static layer, `Main` or the solution may
# import (the growing-fault siblings, `Instances.Goldilocks.Lemmas.Growing` in scripts/boundaries.toml).
[SiblingLayer]
files."Fx/Growing/Lemmas/G.lean" = "module\n\npublic import Fx.Lemmas.L\n\ntheorem g : S := l\n"
edit."Fx.lean" = [['public import Fx.Init', "public import Fx.Growing.Lemmas.G\npublic import Fx.Init"]]
edit."boundaries.toml" = [['''[[layer]]
name = "Proofs.P"''', '''[[layer]]
name = "Growing"
prefixes = ["Fx.Growing.Lemmas"]
sorry = true
allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas"]

[[layer]]
name = "Proofs.P"'''], ['"Main", "Sol"]', '"Main", "Sol", "Growing"]']]

[SiblingIntoStatic]
expect = "FAIL[import] Fx.Growing.Lemmas.G (layer Growing) imported by Fx.Lemmas.N (layer Lemmas)"
files."Fx/Growing/Lemmas/G.lean" = "module\n\npublic import Fx.Lemmas.L\n\ntheorem g : S := l\n"
files."Fx/Lemmas/N.lean" = "module\n\npublic import Fx.Lemmas.M\npublic import Fx.Growing.Lemmas.G\n\ntheorem n : S := m\n"
edit."Fx.lean" = [['public import Fx.Init', "public import Fx.Growing.Lemmas.G\npublic import Fx.Init"]]
edit."boundaries.toml" = [['''[[layer]]
name = "Proofs.P"''', '''[[layer]]
name = "Growing"
prefixes = ["Fx.Growing.Lemmas"]
sorry = true
allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas"]

[[layer]]
name = "Proofs.P"'''], ['"Main", "Sol"]', '"Main", "Sol", "Growing"]']]

[SiblingIntoMain]
expect = "FAIL[import] Fx.Growing.Lemmas.G (layer Growing) imported by Fx.Main (layer Main)"
files."Fx/Growing/Lemmas/G.lean" = "module\n\npublic import Fx.Lemmas.L\n\ntheorem g : S := l\n"
files."Fx/Main.lean" = "module\n\npublic import Fx.Proofs.Q.Main\npublic import Fx.Growing.Lemmas.G\n\ntheorem main : S := q\n"
edit."Fx.lean" = [['public import Fx.Init', "public import Fx.Growing.Lemmas.G\npublic import Fx.Init"]]
edit."boundaries.toml" = [['''[[layer]]
name = "Proofs.P"''', '''[[layer]]
name = "Growing"
prefixes = ["Fx.Growing.Lemmas"]
sorry = true
allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas"]

[[layer]]
name = "Proofs.P"'''], ['"Main", "Sol"]', '"Main", "Sol", "Growing"]']]

# A milestone parent inside another parent's directory (the growing-fault milestones,
# ConsensusLean.Instances.Goldilocks.Proofs.Growing.<M>): each <M> is a milestone of the inner parent.
[NestedParent]
files."Fx/Proofs/G/A/Main.lean" = "module\n\npublic import Fx.Lemmas.L\n\ntheorem ga : S := l\n"
edit."Fx.lean" = [['public import Fx.Proofs.P.Aux', "public import Fx.Proofs.G.A.Main\npublic import Fx.Proofs.P.Aux"]]
edit."boundaries.toml" = [['milestone_parents = ["Fx.Proofs"]', 'milestone_parents = ["Fx.Proofs", "Fx.Proofs.G"]'], ['''[[layer]]
name = "Proofs.P"''', '''[[layer]]
name = "Proofs.G.A"
prefixes = ["Fx.Proofs.G.A"]
sorry = true
allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas"]

[[layer]]
name = "Proofs.P"'''], ['"Main", "Sol"]', '"Main", "Sol", "Proofs.G.A"]']]

[NestedParentUndeclared]
expect = "FAIL[config] layer Proofs.G.A: a milestone layer has the one prefix Fx.Proofs.<M>"
files."Fx/Proofs/G/A/Main.lean" = "module\n\npublic import Fx.Lemmas.L\n\ntheorem ga : S := l\n"
edit."Fx.lean" = [['public import Fx.Proofs.P.Aux', "public import Fx.Proofs.G.A.Main\npublic import Fx.Proofs.P.Aux"]]
edit."boundaries.toml" = [['''[[layer]]
name = "Proofs.P"''', '''[[layer]]
name = "Proofs.G.A"
prefixes = ["Fx.Proofs.G.A"]
sorry = true
allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas"]

[[layer]]
name = "Proofs.P"'''], ['"Main", "Sol"]', '"Main", "Sol", "Proofs.G.A"]']]

[NestedParentStray]
expect = "FAIL[milestone] Fx.Proofs.G.X: a milestone is a directory Fx.Proofs.G.<M>"
files."Fx/Proofs/G/A/Main.lean" = "module\n\npublic import Fx.Lemmas.L\n\ntheorem ga : S := l\n"
files."Fx/Proofs/G/X.lean" = "module\n\npublic import Fx.Lemmas.L\n"
edit."Fx.lean" = [['public import Fx.Proofs.P.Aux', "public import Fx.Proofs.G.A.Main\npublic import Fx.Proofs.G.X\npublic import Fx.Proofs.P.Aux"]]
edit."boundaries.toml" = [['milestone_parents = ["Fx.Proofs"]', 'milestone_parents = ["Fx.Proofs", "Fx.Proofs.G"]'], ['''[[layer]]
name = "Proofs.P"''', '''[[layer]]
name = "Proofs.G.A"
prefixes = ["Fx.Proofs.G.A"]
sorry = true
allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas"]

[[layer]]
name = "Proofs.P"'''], ['"Main", "Sol"]', '"Main", "Sol", "Proofs.G.A"]']]

[NestedParentEntry]
expect = "FAIL[entry] Fx.Main imports Fx.Proofs.G.A.Aux: the milestone layer Proofs.G.A is entered only through Fx.Proofs.G.A.Main"
files."Fx/Proofs/G/A/Main.lean" = "module\n\npublic import Fx.Lemmas.L\n\ntheorem ga : S := l\n"
files."Fx/Proofs/G/A/Aux.lean" = "module\n\npublic import Fx.Lemmas.L\n\ntheorem gaux : S := l\n"
files."Fx/Main.lean" = "module\n\npublic import Fx.Proofs.Q.Main\npublic import Fx.Proofs.G.A.Aux\n\ntheorem main : S := q\n"
edit."Fx.lean" = [['public import Fx.Proofs.P.Aux', "public import Fx.Proofs.G.A.Aux\npublic import Fx.Proofs.G.A.Main\npublic import Fx.Proofs.P.Aux"]]
edit."boundaries.toml" = [['milestone_parents = ["Fx.Proofs"]', 'milestone_parents = ["Fx.Proofs", "Fx.Proofs.G"]'], ['''[[layer]]
name = "Proofs.P"''', '''[[layer]]
name = "Proofs.G.A"
prefixes = ["Fx.Proofs.G.A"]
sorry = true
allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas"]

[[layer]]
name = "Proofs.P"'''], ['"Main", "Sol"]', '"Main", "Sol", "Proofs.G.A"]'], ['allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas", "Proofs.P", "Proofs.Q"]', 'allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas", "Proofs.P", "Proofs.Q", "Proofs.G.A"]'], ['"Proofs.Q", "Main"]', '"Proofs.Q", "Main", "Proofs.G.A"]']]

[NestedParentLayer]
expect = "FAIL[config] layer Proofs.G: prefix Fx.Proofs.G covers the milestone parent Fx.Proofs.G"
files."Fx/Proofs/G/A/Main.lean" = "module\n\npublic import Fx.Lemmas.L\n\ntheorem ga : S := l\n"
edit."Fx.lean" = [['public import Fx.Proofs.P.Aux', "public import Fx.Proofs.G.A.Main\npublic import Fx.Proofs.P.Aux"]]
edit."boundaries.toml" = [['milestone_parents = ["Fx.Proofs"]', 'milestone_parents = ["Fx.Proofs", "Fx.Proofs.G"]'], ['''[[layer]]
name = "Proofs.P"''', '''[[layer]]
name = "Proofs.G"
prefixes = ["Fx.Proofs.G"]
sorry = true
allow = ["Init", "ToMathlib", "Spec", "Statements", "Lemmas"]

[[layer]]
name = "Proofs.P"'''], ['"Main", "Sol"]', '"Main", "Sol", "Proofs.G"]']]

[CrossMilestone]
expect = "FAIL[import] Fx.Proofs.P.Main (layer Proofs.P) imported by Fx.Proofs.Q.Main (layer Proofs.Q)"
edit."boundaries.toml" = [['''[[exception]]
from = ["Fx.Proofs.Q"]
to = ["Fx.Proofs.P.Main"]
reason = "fixture: milestone Q builds on milestone P"
''', '']]

[Entry]
expect = "FAIL[entry] Fx.Main imports Fx.Proofs.P.Aux: the milestone layer Proofs.P is entered only through Fx.Proofs.P.Main"
edit."Fx/Main.lean" = [["public import Fx.Proofs.P.Main\n", "public import Fx.Proofs.P.Main\npublic import Fx.Proofs.P.Aux\n"]]

[EntryViaException]
expect = "FAIL[entry] Fx.Proofs.Q.Main imports Fx.Proofs.P.Aux: the milestone layer Proofs.P is entered only through Fx.Proofs.P.Main"
edit."Fx/Proofs/Q/Main.lean" = [["public import Fx.Proofs.P.Main\n", "public import Fx.Proofs.P.Aux\n"]]
edit."boundaries.toml" = [['to = ["Fx.Proofs.P.Main"]', 'to = ["Fx.Proofs.P"]']]

[SolutionImport]
expect = "FAIL[import] FxSol (layer Sol) imported by Fx.Lemmas.M (layer Lemmas)"
files."Fx/Lemmas/M.lean" = "module\n\npublic import FxSol\n"

[TestImport]
expect = "FAIL[import] FxTest.T (layer Test) imported by FxSol (layer Sol)"
files."FxSol.lean" = "module\n\npublic import FxTest.T\n"

[ImportMathlib]
expect = "FAIL[umbrella] Fx.Spec.B imports Mathlib"
files."Fx/Spec/B.lean" = "module\n\npublic import Fx.Init\npublic import Mathlib\n"

[ImportAll]
expect = "FAIL[import-all] Fx.Lemmas.M: import all Fx.Lemmas.L"
